<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f97316">
<title>筋トレAIコーチ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💪</text></svg>">
<style>
:root{
  --bg:#f4f6f8; --card:#ffffff; --text:#1a2530; --sub:#6b7a89;
  --accent:#f97316; --accent-soft:#ffe3cc; --border:#e3e8ee;
  --warn:#b45309; --warn-bg:#fef3c7; --danger:#dc2626; --danger-bg:#fee2e2;
  --ok:#16a34a; --ok-bg:#dcfce7;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1519; --card:#1a2229; --text:#e8edf2; --sub:#8b9aa8;
    --accent:#fb923c; --accent-soft:#4a2c12; --border:#2a343d;
    --warn:#fbbf24; --warn-bg:#3a2e10; --danger:#f87171; --danger-bg:#3d1a1a;
    --ok:#4ade80; --ok-bg:#0f2e1c;
  }
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text);padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;position:sticky;top:0;z-index:10}
header h1{font-size:17px;font-weight:700}
header .sub{color:rgba(255,255,255,.85);font-size:12px;margin-top:2px}
main{padding:14px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.sub{color:var(--sub);font-size:12px;line-height:1.5}
.btn{display:block;width:100%;padding:13px;border-radius:12px;border:none;font-size:15px;font-weight:700;text-align:center;cursor:pointer}
.btn-primary{background:var(--accent);color:#fff}
.btn-secondary{background:var(--accent-soft);color:var(--accent)}
.btn-ghost{background:transparent;color:var(--sub);border:1px solid var(--border)}
.btn[disabled]{opacity:.5}
.btn + .btn{margin-top:10px}
input[type=text],input[type=password],textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;font-family:inherit}
textarea{resize:vertical;min-height:80px}
label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px;font-weight:600}
.field{margin-bottom:14px}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 0;border:none;border-radius:8px;background:transparent;color:var(--sub);font-size:13px;font-weight:600}
.seg button.sel{background:var(--card);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.step-num{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.center-msg{text-align:center;color:var(--sub);font-size:13px;padding:8px 0}
.ex-row{padding:9px 0;border-bottom:1px solid var(--border)}
.ex-row:last-child{border-bottom:none}
.ex-name{font-weight:700;font-size:14px;margin-bottom:3px}
.ex-sets{font-size:12.5px;color:var(--sub);line-height:1.6}
.ex-max{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;margin-left:6px}
.eval-box{background:var(--accent-soft);border-radius:10px;padding:12px;font-size:13.5px;line-height:1.7;color:var(--text)}
.menu-focus{font-weight:700;font-size:15px;color:var(--accent);margin-bottom:8px}
.menu-ex{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13.5px}
.menu-ex:last-child{border-bottom:none}
.menu-ex .n{font-weight:600}
.menu-ex .t{color:var(--sub);text-align:right}
.menu-notes{margin-top:10px;background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:9px 10px;font-size:12.5px;line-height:1.6}
.hist-item{padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer}
.hist-item:last-child{border-bottom:none}
.hist-date{font-weight:700;font-size:14px}
.hist-summary{color:var(--sub);font-size:12.5px;margin-top:3px}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:40px 10px}
.err-box{background:var(--danger-bg);color:var(--danger);border-radius:10px;padding:11px;font-size:13px;margin-bottom:12px;line-height:1.6}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tabbar button{flex:1;background:none;border:none;padding:10px 0 8px;color:var(--sub);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar button .ic{font-size:20px}
.tabbar button.sel{color:var(--accent)}
.detail-close{float:right;color:var(--sub);font-size:13px}
.saved-badge{display:inline-block;background:var(--ok-bg);color:var(--ok);font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;margin-bottom:10px}
</style>
</head>
<body>
<header>
  <h1>💪 筋トレAIコーチ</h1>
  <div class="sub" id="headerSub">Claudeチャットと連携して評価&次回メニューを記録</div>
</header>
<main id="app"></main>
<nav class="tabbar">
  <button data-tab="home" class="tab-btn"><span class="ic">📝</span>記録</button>
  <button data-tab="history" class="tab-btn"><span class="ic">📋</span>履歴</button>
  <button data-tab="settings" class="tab-btn"><span class="ic">⚙️</span>設定</button>
</nav>

<script>
const LS_KEY_SESSIONS = 'wac_sessions';
const LS_KEY_CONDITION = 'wac_condition';
const LS_KEY_GYM_EQUIP_1 = 'wac_gym_equip_1';
const LS_KEY_GYM_EQUIP_2 = 'wac_gym_equip_2';
const LS_KEY_LAST_GYM = 'wac_last_gym';
const DEFAULT_CONDITION = '左ハムストリング肉離れ(2026-07-04受傷)からリハビリ中。脚トレは控えめ・痛みが出ない範囲で漸進的に。目的は健康維持・筋力向上・体脂肪率の低下。筋トレ週3-4回、有酸素運動(ランニング・ウォーキング)週3-4回。';

const GYM_NAMES = { '1': 'エニタイムフィットネス志村坂上店', '2': 'エニタイムフィットネス文京本郷店（本郷三丁目）' };
const DEFAULT_EQUIP_1 = `【マシンエリア】レッグエクステンション、レッグカール、レッグプレス、インナーサイ/アウターサイ、ショルダープレス、チェストプレス、シーテッドロウ、プルダウン(2台)、ロータリートルソー、アブドミナル、インクラインプレス、アングルドレッグプレス、ペクトラル・フライ/リア・デルトイド、グルード・ブリッジ
【フリーウェイトエリア】DPLシーテッドロウ、DPLショルダープレス、デッドリフトエリート、パワーラック(2台)、スミスマシン、ケーブルマシン、プリチャーカール、シーテッドアームカール、アジャスタブルベンチ(3台)、フラットベンチ、ダンベル(1〜50kg)、ディップ/チンアシスト、アイソラテラル系マシン各種、Tバーロウ、ラテラルレイズ、ハックスクワット
【有酸素】ステアクライマー、トレッドミル(8台)、リカンベントバイク(2台)、アップライトバイク(2台)、クロストレーナー(2台)
【ファンクショナル】ケーブルマシン、バランスボール、ゴムチューブ、ストレッチポール`;
const DEFAULT_EQUIP_2 = `【筋トレマシン(PRECOR製)】ペクトラルフライ、ショルダープレス、ディップ/チン、バイセップカール/トライセップエクステンション、アブドミナル、ロータリートルソー、チェストプレス、シーテッドロー、ラットプルダウン、バックエクステンション、レッグプレス、レッグカール、レッグエクステンション、インナー/アウターサイ、腹筋台、背筋台
【フリーウェイト】ケーブルマシン(1台)、パワーラック(3台)、スミスマシン(1台) ※ダンベル等の詳細は未確認、実際と異なる場合はここを編集してください
【有酸素(PRECOR製)】トレッドミル(8台)、クロストレーナー(2台)、リカンベントバイク(2台)、アップライトバイク(2台)
【その他】ストレッチエリア、体組成計`;

let state = { tab: 'home', pendingResult: null, error: null, selectedGym: null, viewingSession: null };

function getSessions(){ try{ return JSON.parse(localStorage.getItem(LS_KEY_SESSIONS)||'[]'); }catch(e){ return []; } }
function saveSessions(list){ localStorage.setItem(LS_KEY_SESSIONS, JSON.stringify(list)); }
function getCondition(){ return localStorage.getItem(LS_KEY_CONDITION) || DEFAULT_CONDITION; }
function getGymEquip(id){ return localStorage.getItem(id==='1'?LS_KEY_GYM_EQUIP_1:LS_KEY_GYM_EQUIP_2) || (id==='1'?DEFAULT_EQUIP_1:DEFAULT_EQUIP_2); }
function getLastGym(){ return localStorage.getItem(LS_KEY_LAST_GYM) || '1'; }

function switchTab(tab){
  state.tab = tab;
  state.pendingResult = null; state.error = null; state.viewingSession = null;
  render();
}

function render(){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('sel', b.dataset.tab===state.tab));
  const app = document.getElementById('app');
  if(state.tab==='home') app.innerHTML = renderHome();
  else if(state.tab==='history') app.innerHTML = renderHistory();
  else app.innerHTML = renderSettings();
  bindEvents();
}

function renderHome(){
  if(state.selectedGym===null) state.selectedGym = getLastGym();
  if(state.pendingResult){
    return renderResult(state.pendingResult, true);
  }
  let html = `<div class="card">
    <h2>📍 次回行くジム</h2>
    <div class="seg">
      <button data-gym="1" class="gym-btn${state.selectedGym==='1'?' sel':''}">志村坂上店</button>
      <button data-gym="2" class="gym-btn${state.selectedGym==='2'?' sel':''}">本郷三丁目店</button>
    </div>
  </div>`;

  html += `<div class="card">
    <h2><span class="step-num">1</span> プロンプトをコピー</h2>
    <div class="sub" style="margin-bottom:12px">コピーしたら、Claudeとのチャットに「筋トレMEMO」の写真と一緒に貼り付けて送ってください。</div>
    <button class="btn btn-primary" id="btnCopyPrompt">📋 プロンプトをコピー</button>
    <div id="copyDone" class="center-msg" style="display:none;color:var(--ok)">✓ コピーしました</div>
  </div>`;

  html += `<div class="card">
    <h2><span class="step-num">2</span> Claudeの回答を貼り付け</h2>
    <div class="sub" style="margin-bottom:8px">Claudeが返したJSON形式の回答をそのまま貼り付けてください。</div>
    <textarea id="inputPaste" placeholder='{"date": "...", "exercises": [...], ...}'></textarea>
    <button class="btn btn-primary" id="btnParse" style="margin-top:10px">貼り付けた内容を解析</button>`;
  if(state.error){
    html += `<div class="err-box" style="margin-top:12px">${escapeHtml(state.error)}</div>`;
  }
  html += `</div>`;
  return html;
}

function renderResult(result, isPending){
  let html = '<div class="card">';
  if(isPending){ html += `<div class="saved-badge">✓ 解析完了</div>`; }
  html += `<h2>📊 抽出した記録${result.date ? ' — '+escapeHtml(result.date) : ''}</h2>`;
  (result.exercises||[]).forEach(ex=>{
    html += `<div class="ex-row"><div class="ex-name">${escapeHtml(ex.name)}${ex.maxRM?`<span class="ex-max">MAX 1RM ${ex.maxRM}kg</span>`:''}</div>`;
    html += `<div class="ex-sets">`;
    (ex.sets||[]).forEach((s,i)=>{ html += `${i+1}) ${s.weight}kg × ${s.reps}reps　`; });
    html += `</div></div>`;
  });
  html += `</div>`;

  html += `<div class="card"><h2>📝 評価</h2><div class="eval-box">${escapeHtml(result.evaluation||'')}</div></div>`;

  if(result.next_menu){
    const nm = result.next_menu;
    html += `<div class="card"><h2>🎯 次回のトレーニングメニュー</h2>`;
    if(nm.gym){ html += `<div class="sub" style="margin-bottom:6px">📍 ${escapeHtml(nm.gym)}</div>`; }
    html += `<div class="menu-focus">${escapeHtml(nm.focus||'')}</div>`;
    (nm.exercises||[]).forEach(ex=>{
      html += `<div class="menu-ex"><div class="n">${escapeHtml(ex.name)}</div><div class="t">${escapeHtml(ex.target||'')}</div></div>`;
    });
    if(nm.notes){ html += `<div class="menu-notes">⚠️ ${escapeHtml(nm.notes)}</div>`; }
    html += `</div>`;
  }

  if(isPending){
    html += `<div class="card"><button class="btn btn-primary" id="btnSave">履歴に保存</button>
      <button class="btn btn-ghost" id="btnDiscard">破棄してやり直す</button></div>`;
  }
  return html;
}

function renderHistory(){
  const sessions = getSessions();
  if(state.viewingSession){
    const s = state.viewingSession;
    let html = `<div class="card"><span class="detail-close" id="btnCloseDetail">閉じる ✕</span><div style="clear:both"></div></div>`;
    html += renderResult(s, false);
    html += `<div class="card"><button class="btn btn-ghost" id="btnDeleteSession">この記録を削除</button></div>`;
    return html;
  }
  if(sessions.length===0){
    return `<div class="empty">まだ記録がありません。<br>「記録」タブから最初のトレーニングを追加しましょう。</div>`;
  }
  let html = '<div class="card">';
  sessions.slice().reverse().forEach(s=>{
    const names = (s.exercises||[]).map(e=>e.name).join('、');
    const nextFocus = s.next_menu ? `　→次回: ${s.next_menu.focus||''}` : '';
    html += `<div class="hist-item" data-id="${s.id}">
      <div class="hist-date">${escapeHtml(s.date||'')}</div>
      <div class="hist-summary">${escapeHtml(names)}${escapeHtml(nextFocus)}</div>
    </div>`;
  });
  html += '</div>';
  return html;
}

function renderSettings(){
  return `<div class="card">
    <div class="field">
      <label>現在のコンディション・目標（Claudeへの申し送り事項）</label>
      <textarea id="inputCondition">${escapeHtml(getCondition())}</textarea>
      <div class="sub" style="margin-top:6px">怪我の状態や目標が変わったらここを更新してください。コピーするプロンプトに反映されます。</div>
    </div>
    <button class="btn btn-primary" id="btnSaveSettings">保存</button>
    <div id="settingsSaved" class="center-msg" style="display:none;color:var(--ok)">✓ 保存しました</div>
  </div>
  <div class="card">
    <h2>🏋️ ジム設備（プロンプトに含める設備制約）</h2>
    <div class="field">
      <label>${escapeHtml(GYM_NAMES['1'])}</label>
      <textarea id="inputEquip1" style="min-height:140px">${escapeHtml(getGymEquip('1'))}</textarea>
    </div>
    <div class="field">
      <label>${escapeHtml(GYM_NAMES['2'])}</label>
      <textarea id="inputEquip2" style="min-height:140px">${escapeHtml(getGymEquip('2'))}</textarea>
    </div>
    <div class="sub" style="margin-bottom:10px">設備リストはWeb情報を元にした概算です。実際と異なる場合はここで編集してください。</div>
    <button class="btn btn-primary" id="btnSaveEquip">設備リストを保存</button>
    <div id="equipSaved" class="center-msg" style="display:none;color:var(--ok)">✓ 保存しました</div>
  </div>`;
}

function bindEvents(){
  document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));

  document.querySelectorAll('.gym-btn').forEach(b=>{
    b.onclick = ()=>{
      state.selectedGym = b.dataset.gym;
      localStorage.setItem(LS_KEY_LAST_GYM, b.dataset.gym);
      render();
    };
  });

  const btnCopyPrompt = document.getElementById('btnCopyPrompt');
  if(btnCopyPrompt) btnCopyPrompt.onclick = async ()=>{
    const prompt = buildPrompt(state.selectedGym);
    await copyToClipboard(prompt);
    const msg = document.getElementById('copyDone');
    msg.style.display='block';
    setTimeout(()=>{ msg.style.display='none'; }, 1800);
  };

  const btnParse = document.getElementById('btnParse');
  if(btnParse) btnParse.onclick = ()=>{
    const raw = document.getElementById('inputPaste').value;
    try{
      const result = parseClaudeJson(raw);
      state.pendingResult = result;
      state.error = null;
      render();
    }catch(e){
      state.error = '解析に失敗しました。貼り付けた内容がJSON形式か確認してください。';
      render();
    }
  };

  const btnSave = document.getElementById('btnSave');
  if(btnSave) btnSave.onclick = ()=>{
    const sessions = getSessions();
    const result = state.pendingResult;
    result.id = Date.now().toString();
    sessions.push(result);
    saveSessions(sessions);
    state.pendingResult = null;
    switchTab('history');
  };

  const btnDiscard = document.getElementById('btnDiscard');
  if(btnDiscard) btnDiscard.onclick = ()=>{ state.pendingResult=null; render(); };

  const btnSaveSettings = document.getElementById('btnSaveSettings');
  if(btnSaveSettings) btnSaveSettings.onclick = ()=>{
    localStorage.setItem(LS_KEY_CONDITION, document.getElementById('inputCondition').value.trim());
    const msg = document.getElementById('settingsSaved');
    msg.style.display='block';
    setTimeout(()=>{ msg.style.display='none'; }, 1800);
  };

  const btnSaveEquip = document.getElementById('btnSaveEquip');
  if(btnSaveEquip) btnSaveEquip.onclick = ()=>{
    localStorage.setItem(LS_KEY_GYM_EQUIP_1, document.getElementById('inputEquip1').value.trim());
    localStorage.setItem(LS_KEY_GYM_EQUIP_2, document.getElementById('inputEquip2').value.trim());
    const msg = document.getElementById('equipSaved');
    msg.style.display='block';
    setTimeout(()=>{ msg.style.display='none'; }, 1800);
  };

  document.querySelectorAll('.hist-item').forEach(el=>{
    el.onclick = ()=>{
      const sessions = getSessions();
      state.viewingSession = sessions.find(s=>s.id===el.dataset.id);
      render();
    };
  });
  const btnCloseDetail = document.getElementById('btnCloseDetail');
  if(btnCloseDetail) btnCloseDetail.onclick = ()=>{ state.viewingSession=null; render(); };

  const btnDeleteSession = document.getElementById('btnDeleteSession');
  if(btnDeleteSession) btnDeleteSession.onclick = ()=>{
    if(!confirm('この記録を削除しますか？')) return;
    const sessions = getSessions().filter(s=>s.id!==state.viewingSession.id);
    saveSessions(sessions);
    state.viewingSession = null;
    render();
  };
}

async function copyToClipboard(text){
  if(navigator.clipboard && window.isSecureContext){
    try{ await navigator.clipboard.writeText(text); return; }catch(e){ /* fall through */ }
  }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
}

function parseClaudeJson(text){
  let t = text.trim();
  t = t.replace(/^```json\s*/i, '').replace(/^```\s*/, '').replace(/```\s*$/, '');
  return JSON.parse(t);
}

function buildPrompt(gymId){
  const sessions = getSessions().slice(-3);
  let historyText = 'なし（初回の記録です）';
  if(sessions.length>0){
    historyText = sessions.map(s=>{
      const names = (s.exercises||[]).map(e=>e.name).join('、');
      return `${s.date}: ${names} / 評価メモ: ${(s.evaluation||'').slice(0,80)}`;
    }).join('\n');
  }
  const gymName = GYM_NAMES[gymId];
  const gymEquip = getGymEquip(gymId);
  return `あなたは経験豊富なパーソナルトレーナーです。添付した「筋トレMEMO」のサマリー画面の写真から、その日のトレーニング内容を正確に読み取り、評価と次回のトレーニングメニューを提案してください。

【ユーザー情報】
${getCondition()}

【直近のセッション履歴（参考・漸進性の判断に使用）】
${historyText}

【次回トレーニングを行うジム】${gymName}
【このジムの設備】
${gymEquip}
次回メニューの種目は、必ず上記の設備のみで実施できるものにしてください。設備にない種目は提案しないでください。

【出力ルール】
以下のJSON形式のみを出力してください。説明文やMarkdownのコードフェンス(\`\`\`)は一切付けないでください。
{

  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
