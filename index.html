<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f97316">
<title>筋トレAIコーチ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💪</text></svg>">
<style>
:root{
  --bg:#f4f6f8; --card:#ffffff; --text:#1a2530; --sub:#6b7a89;
  --accent:#f97316; --accent-soft:#ffe3cc; --border:#e3e8ee;
  --warn:#b45309; --warn-bg:#fef3c7; --danger:#dc2626; --danger-bg:#fee2e2;
  --ok:#16a34a; --ok-bg:#dcfce7;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1519; --card:#1a2229; --text:#e8edf2; --sub:#8b9aa8;
    --accent:#fb923c; --accent-soft:#4a2c12; --border:#2a343d;
    --warn:#fbbf24; --warn-bg:#3a2e10; --danger:#f87171; --danger-bg:#3d1a1a;
    --ok:#4ade80; --ok-bg:#0f2e1c;
  }
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text);padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;position:sticky;top:0;z-index:10}
header h1{font-size:17px;font-weight:700}
header .sub{color:rgba(255,255,255,.85);font-size:12px;margin-top:2px}
main{padding:14px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.sub{color:var(--sub);font-size:12px;line-height:1.5}
.btn{display:block;width:100%;padding:13px;border-radius:12px;border:none;font-size:15px;font-weight:700;text-align:center;cursor:pointer}
.btn-primary{background:var(--accent);color:#fff}
.btn-secondary{background:var(--accent-soft);color:var(--accent)}
.btn-ghost{background:transparent;color:var(--sub);border:1px solid var(--border)}
.btn[disabled]{opacity:.5}
.btn + .btn{margin-top:10px}
input[type=text],input[type=password],input[type=number],input[type=date],textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;font-family:inherit}
textarea{resize:vertical;min-height:80px}
label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px;font-weight:600}
.field{margin-bottom:14px}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 0;border:none;border-radius:8px;background:transparent;color:var(--sub);font-size:13px;font-weight:600}
.seg button.sel{background:var(--card);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.step-num{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.center-msg{text-align:center;color:var(--sub);font-size:13px;padding:8px 0}
.ex-row{padding:9px 0;border-bottom:1px solid var(--border)}
.ex-row:last-child{border-bottom:none}
.ex-name{font-weight:700;font-size:14px;margin-bottom:3px}
.ex-sets{font-size:12.5px;color:var(--sub);line-height:1.6}
.ex-max{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;margin-left:6px}
.eval-box{background:var(--accent-soft);border-radius:10px;padding:12px;font-size:13.5px;line-height:1.7;color:var(--text)}
.menu-focus{font-weight:700;font-size:15px;color:var(--accent);margin-bottom:8px}
.menu-group-label{font-size:11.5px;font-weight:700;color:var(--sub);margin:10px 0 2px}
.menu-ex{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13.5px}
.menu-ex:last-child{border-bottom:none}
.menu-ex .n{font-weight:600}
.menu-ex .t{color:var(--sub);text-align:right;flex-shrink:0}
.menu-warm{font-size:11px;color:var(--warn);font-weight:normal;margin-top:2px}
.menu-notes{margin-top:10px;background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:9px 10px;font-size:12.5px;line-height:1.6}
/* workout entry */
.entry-row{padding:10px 0;border-bottom:1px solid var(--border)}
.entry-row:last-child{border-bottom:none}
.entry-head{display:flex;gap:6px;align-items:center}
.entry-name{flex:1}
.entry-hint{font-size:11px;color:var(--sub);margin:5px 0 2px}
.entry-del{background:transparent;border:1px solid var(--border);color:var(--sub);border-radius:8px;width:34px;height:38px;font-size:13px;flex-shrink:0;cursor:pointer}
.set-row{display:flex;align-items:center;gap:5px;margin-top:6px}
.set-row input{padding:8px;font-size:13px;text-align:center;min-width:0;flex:1}
.set-label{width:38px;flex-shrink:0;font-size:11.5px;font-weight:700;color:var(--sub);text-align:center}
.set-label.warm{color:var(--warn);font-size:10.5px}
.entry-x{color:var(--sub);font-size:12px}
.set-del{background:transparent;border:1px solid var(--border);color:var(--sub);border-radius:8px;width:30px;height:34px;font-size:15px;flex-shrink:0;cursor:pointer;line-height:1}
.set-add{background:transparent;border:1px dashed var(--border);color:var(--sub);border-radius:8px;padding:6px 0;width:100%;font-size:12px;margin-top:7px;cursor:pointer}
.warm-hint{font-size:11px;color:var(--warn);margin:3px 0 0 43px}
.share-preview{width:100%;border-radius:10px;border:1px solid var(--border);margin-top:12px;display:block}
/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-title{font-size:15px;font-weight:700}
.cal-nav{background:transparent;border:1px solid var(--border);color:var(--text);width:34px;height:30px;border-radius:8px;font-size:17px;line-height:1;cursor:pointer}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{text-align:center;font-size:10.5px;color:var(--sub);font-weight:700;padding:3px 0}
.cal-dow.sun{color:#f87171}
.cal-dow.sat{color:#60a5fa}
.cal-cell{min-height:38px;border-radius:7px;padding:3px 0 2px;display:flex;flex-direction:column;align-items:center;gap:2px}
.cal-cell.empty{min-height:0}
.cal-cell.has-rec{background:var(--bg);cursor:pointer}
.cal-cell.today{outline:1.5px solid var(--accent)}
.cal-day{font-size:12px;line-height:1.2}
.cal-cell.has-rec .cal-day{font-weight:700}
.cal-marks{display:flex;gap:2px;min-height:7px}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.dot-strength{background:var(--accent)}
.dot-run{background:#ef4444}
.dot-walk{background:#3b82f6}
.cal-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:11px;color:var(--sub)}
.cal-legend span{display:flex;align-items:center;gap:4px}
.cal-legend-total{margin-left:auto;font-weight:700}
.hist-item{padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer}
.hist-item:last-child{border-bottom:none}
.hist-date{font-weight:700;font-size:14px}
.hist-summary{color:var(--sub);font-size:12.5px;margin-top:3px}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:40px 10px}
.err-box{background:var(--danger-bg);color:var(--danger);border-radius:10px;padding:11px;font-size:13px;margin-bottom:12px;line-height:1.6}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tabbar button{flex:1;background:none;border:none;padding:10px 0 8px;color:var(--sub);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar button .ic{font-size:20px}
.tabbar button.sel{color:var(--accent)}
.detail-close{float:right;color:var(--sub);font-size:13px}
.saved-badge{display:inline-block;background:var(--ok-bg);color:var(--ok);font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;margin-bottom:10px}
</style>
</head>
<body>
<header>
  <h1>💪 筋トレAIコーチ</h1>
  <div class="sub" id="headerSub">Claudeチャットと連携して評価&次回メニューを記録</div>
</header>
<main id="app"></main>
<nav class="tabbar">
  <button data-tab="home" class="tab-btn"><span class="ic">📝</span>記録</button>
  <button data-tab="history" class="tab-btn"><span class="ic">📋</span>履歴</button>
  <button data-tab="settings" class="tab-btn"><span class="ic">⚙️</span>設定</button>
</nav>

<script>
const LS_KEY_SESSIONS = 'wac_sessions';
const LS_KEY_CONDITION = 'wac_condition';
const LS_KEY_GYM_EQUIP_1 = 'wac_gym_equip_1';
const LS_KEY_GYM_EQUIP_2 = 'wac_gym_equip_2';
const LS_KEY_LAST_GYM = 'wac_last_gym';
const DEFAULT_CONDITION = '左ハムストリング肉離れ(2026-07-04受傷)からリハビリ中。脚トレは控えめ・痛みが出ない範囲で漸進的に。目的は健康維持・筋力向上・体脂肪率の低下。筋トレ週3-4回、有酸素運動(ランニング・ウォーキング)週3-4回。';

const GYM_NAMES = { '1': 'エニタイムフィットネス志村坂上店', '2': 'エニタイムフィットネス文京本郷店（本郷三丁目）' };
const CARDIO_LABELS = { 'none': 'なし', 'walk': 'ウォーキング', 'run': 'ランニング' };
const DEFAULT_EQUIP_1 = `【マシンエリア】レッグエクステンション、レッグカール、レッグプレス、インナーサイ/アウターサイ、ショルダープレス、チェストプレス、シーテッドロウ、プルダウン(2台)、ロータリートルソー、アブドミナル、インクラインプレス、アングルドレッグプレス、ペクトラル・フライ/リア・デルトイド、グルード・ブリッジ
【フリーウェイトエリア】DPLシーテッドロウ、DPLショルダープレス、デッドリフトエリート、パワーラック(2台)、スミスマシン、ケーブルマシン、プリチャーカール、シーテッドアームカール、アジャスタブルベンチ(3台)、フラットベンチ、ダンベル(1〜50kg)、ディップ/チンアシスト、アイソラテラル系マシン各種、Tバーロウ、ラテラルレイズ、ハックスクワット
【有酸素】ステアクライマー、トレッドミル(8台)、リカンベントバイク(2台)、アップライトバイク(2台)、クロストレーナー(2台)
【ファンクショナル】ケーブルマシン、バランスボール、ゴムチューブ、ストレッチポール`;
const DEFAULT_EQUIP_2 = `【筋トレマシン(PRECOR製)】ペクトラルフライ、ショルダープレス、ディップ/チン、バイセップカール/トライセップエクステンション、アブドミナル、ロータリートルソー、チェストプレス、シーテッドロー、ラットプルダウン、バックエクステンション、レッグプレス、レッグカール、レッグエクステンション、インナー/アウターサイ、腹筋台、背筋台
【フリーウェイト】ケーブルマシン(1台)、パワーラック(3台)、スミスマシン(1台) ※ダンベル等の詳細は未確認、実際と異なる場合はここを編集してください
【有酸素(PRECOR製)】トレッドミル(8台)、クロストレーナー(2台)、リカンベントバイク(2台)、アップライトバイク(2台)
【その他】ストレッチエリア、体組成計`;

let state = { tab: 'home', pendingResult: null, error: null, selectedGym: null, cardio: null, cardioLogDate: null, viewingSession: null, calMonth: null, entryRows: null, entryRowsFromMenu: false, shareImage: null };

function getSessions(){ try{ return JSON.parse(localStorage.getItem(LS_KEY_SESSIONS)||'[]'); }catch(e){ return []; } }
function saveSessions(list){ localStorage.setItem(LS_KEY_SESSIONS, JSON.stringify(list)); }
function getCondition(){ return localStorage.getItem(LS_KEY_CONDITION) || DEFAULT_CONDITION; }
function getGymEquip(id){ return localStorage.getItem(id==='1'?LS_KEY_GYM_EQUIP_1:LS_KEY_GYM_EQUIP_2) || (id==='1'?DEFAULT_EQUIP_1:DEFAULT_EQUIP_2); }
function getLastGym(){ return localStorage.getItem(LS_KEY_LAST_GYM) || '1'; }

function switchTab(tab){
  state.tab = tab;
  state.pendingResult = null; state.error = null; state.viewingSession = null; state.cardio = null; state.cardioLogDate = null;
  state.entryRows = null; state.entryRowsFromMenu = false; state.shareImage = null;
  render();
}

function getLastStrengthSession(){
  const sessions = getSessions().filter(s=>s.type!=='cardio' && s.next_menu);
  if(sessions.length===0) return null;
  return sessions.sort((a,b)=>(a.date||'').localeCompare(b.date||''))[sessions.length-1];
}

function emptySet(){ return { weight:'', reps:'', warmup:false }; }
function emptyRow(){ return { name:'', sets:[emptySet(), emptySet(), emptySet()] }; }

function buildInitialEntryRows(){
  const last = getLastStrengthSession();
  const nm = last && last.next_menu;
  const items = [];
  if(nm){
    (nm.must_exercises||[]).forEach(e=>{ if(e.name) items.push(e); });
    (nm.optional_exercises||[]).forEach(e=>{ if(e.name) items.push(e); });
  }
  if(items.length===0){
    state.entryRowsFromMenu = false;
    return [emptyRow(), emptyRow(), emptyRow(), emptyRow()];
  }
  state.entryRowsFromMenu = true;
  return items.map(e=>{
    const w = e.warmup;
    const warm = (w && (w.weight!=null || w.reps!=null)) ? w : null;
    const sets = [];
    if(warm){
      sets.push({ weight: warm.weight!=null?String(warm.weight):'', reps: warm.reps!=null?String(warm.reps):'', warmup:true });
    }
    const n = countTargetSets(e.target);
    for(let i=0;i<n;i++) sets.push(emptySet());
    return { name: e.name, sets, hint: e.target||'', warmupHint: warm ? formatWarmupHint(warm) : '' };
  });
}

function countTargetSets(target){
  if(!target) return 3;
  const m = String(target).match(/(\d+)\s*(?:[-〜~]\s*(\d+))?\s*セット/);
  if(m) return Math.min(6, parseInt(m[2]||m[1], 10) || 3);
  return 3;
}

function formatWarmupHint(w){
  if(!w) return '';
  const wt = w.weight!=null ? `${w.weight}kg` : '';
  const rp = w.reps!=null ? `${w.reps}回` : '';
  return [wt, rp].filter(Boolean).join(' × ');
}

function collectEntryRows(){
  const rows = [];
  document.querySelectorAll('.entry-row').forEach(el=>{
    const sets = [];
    el.querySelectorAll('.set-row').forEach(sEl=>{
      sets.push({
        weight: sEl.querySelector('.set-weight').value,
        reps: sEl.querySelector('.set-reps').value,
        warmup: sEl.dataset.warmup === '1'
      });
    });
    rows.push({
      name: el.querySelector('.entry-name').value,
      sets,
      hint: el.dataset.hint || '',
      warmupHint: el.dataset.warmupHint || ''
    });
  });
  return rows;
}

function entryRowsToText(rows){
  // 本番セット（アップ以外）が1つでも入力されている種目のみ「実施した」とみなす
  const done = rows.filter(r=>r.name.trim() && r.sets.some(s=>!s.warmup && (s.weight!=='' || s.reps!=='')));
  if(done.length===0) return null;
  return done.map(r=>{
    let workIdx = 0;
    const lines = r.sets
      .filter(s=>s.weight!=='' || s.reps!=='')
      .map(s=>{
        const wPart = s.weight!=='' ? `${s.weight}kg` : '自重';
        const rPart = s.reps!=='' ? ` × ${s.reps}回` : '';
        const label = s.warmup ? 'アップ' : 'セット'+(++workIdx);
        return `    ${label}: ${wPart}${rPart}`;
      });
    return `- ${r.name.trim()}\n${lines.join('\n')}`;
  }).join('\n');
}

function render(){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('sel', b.dataset.tab===state.tab));
  const app = document.getElementById('app');
  if(state.tab==='home') app.innerHTML = renderHome();
  else if(state.tab==='history') app.innerHTML = renderHistory();
  else app.innerHTML = renderSettings();
  bindEvents();
}

function renderHome(){
  if(state.selectedGym===null) state.selectedGym = getLastGym();
  if(state.cardio===null) state.cardio = 'none';
  if(state.pendingResult){
    return renderResult(state.pendingResult, true);
  }
  let html = `<div class="card">
    <h2>📍 次回行くジム</h2>
    <div class="seg">
      <button data-gym="1" class="gym-btn${state.selectedGym==='1'?' sel':''}">志村坂上店</button>
      <button data-gym="2" class="gym-btn${state.selectedGym==='2'?' sel':''}">本郷三丁目店</button>
    </div>
  </div>`;

  if(state.cardioLogDate===null || state.cardioLogDate===undefined) state.cardioLogDate = todayStr();
  html += `<div class="card">
    <h2>🏃 今日の有酸素運動</h2>
    <div class="sub" style="margin-bottom:8px">筋トレと同じ日に走った/歩いたかを選んでください。プロンプトに含まれ、次回メニューの判断にも使われます。</div>
    <div class="seg">
      <button data-cardio="none" class="cardio-btn${state.cardio==='none'?' sel':''}">なし</button>
      <button data-cardio="walk" class="cardio-btn${state.cardio==='walk'?' sel':''}">ウォーキング</button>
      <button data-cardio="run" class="cardio-btn${state.cardio==='run'?' sel':''}">ランニング</button>
    </div>
    <div class="field" style="margin-top:12px;margin-bottom:0">
      <label>筋トレなしで有酸素だけ記録したい日</label>
      <input type="date" id="inputCardioDate" value="${escapeAttr(state.cardioLogDate)}">
    </div>
    <button class="btn btn-secondary" id="btnLogCardioOnly" style="margin-top:10px">この内容だけ記録する（筋トレなし）</button>
    <div id="cardioLogSaved" class="center-msg" style="display:none;color:var(--ok)">✓ 記録しました</div>
  </div>`;

  if(state.entryRows===null || state.entryRows===undefined) state.entryRows = buildInitialEntryRows();
  html += `<div class="card">
    <h2>🏋️ 今日やった筋トレ</h2>
    <div class="sub" style="margin-bottom:10px">${state.entryRowsFromMenu ? '前回提案したメニューを読み込みました。やった種目に重量・回数を入れてください（空欄の種目は「やらなかった」扱いになります）。' : '種目・重量・回数を入力してください。'}</div>
    <div id="entryRows">`;
  state.entryRows.forEach((r,i)=>{
    html += `<div class="entry-row" data-i="${i}" data-hint="${escapeAttr(r.hint||'')}" data-warmup-hint="${escapeAttr(r.warmupHint||'')}">
      <div class="entry-head">
        <input type="text" class="entry-name" data-i="${i}" placeholder="種目名" value="${escapeAttr(r.name)}">
        <button class="entry-del" data-i="${i}" title="種目を削除">✕</button>
      </div>`;
    if(r.hint){ html += `<div class="entry-hint">目安: ${escapeHtml(r.hint)}</div>`; }
    let workIdx = 0;
    (r.sets||[]).forEach((s,j)=>{
      const label = s.warmup ? 'アップ' : String(++workIdx);
      html += `<div class="set-row" data-i="${i}" data-j="${j}" data-warmup="${s.warmup?'1':'0'}">
        <span class="set-label${s.warmup?' warm':''}">${label}</span>
        <input type="number" class="set-weight" placeholder="kg" inputmode="decimal" value="${escapeAttr(s.weight)}">
        <span class="entry-x">×</span>
        <input type="number" class="set-reps" placeholder="回" inputmode="numeric" value="${escapeAttr(s.reps)}">
        <button class="set-del" data-i="${i}" data-j="${j}" title="セットを削除">−</button>
      </div>`;
      if(s.warmup && r.warmupHint){
        html += `<div class="warm-hint">↑ 推奨: ${escapeHtml(r.warmupHint)}</div>`;
      }
    });
    html += `<button class="set-add" data-i="${i}">＋ セット追加</button>
    </div>`;
  });
  html += `</div>
    <button class="btn btn-ghost" id="btnAddRow" style="margin-top:8px">＋ 種目を追加</button>
    <button class="btn btn-secondary" id="btnResetRows" style="margin-top:8px">前回メニューを読み込み直す</button>
  </div>`;

  html += `<div class="card">
    <h2><span class="step-num">1</span> プロンプトをコピー</h2>

    let wi = 0;

    html += `<div class="menu-focus">${escapeHtml(nm.focus||'')}</div>`;

      html += `<div class="menu-group-label">🔴 必須</div>`;

        html += `<div class="menu-ex"><div class="n">${escapeHtml(ex.name)}${ex.warmup&&(ex.warmup.weight!=null||ex.warmup.reps!=null)?`<div class="menu-warm">アップ: ${escapeHtml(formatWarmupHint(ex.warmup))}</div>`:''}</div><div class="t">${escapeHtml(ex.target||'')}${ex.rest?`<br>レスト ${escapeHtml(ex.rest)}`:''}</div></div>`;

    }
    if((nm.optional_exercises||[]).length){
      html += `<div class="menu-group-label">🟡 余裕があれば</div>`;
      nm.optional_exercises.forEach(ex=>{
        html += `<div class="menu-ex"><div class="n">${escapeHtml(ex.name)}${ex.warmup&&(ex.warmup.weight!=null||ex.warmup.reps!=null)?`<div class="menu-warm">アップ: ${escapeHtml(formatWarmupHint(ex.warmup))}</div>`:''}</div><div class="t">${escapeHtml(ex.target||'')}${ex.rest?`<br>レスト ${escapeHtml(ex.rest)}`:''}</div></div>`;

    if(nm.notes){ html += `<div class="menu-notes">⚠️ ${escapeHtml(nm.notes)}</div>`; }

function buildShareText(s){
  if(!s) return '';
  let out = `🏋️ ${s.date||''} のトレーニング\n`;
  if(s.type==='cardio'){
    out += `\n${s.cardio==='run'?'🏃 ランニング':'🚶 ウォーキング'}\n`;
    return out;
  }
  if(s.cardio && s.cardio!=='none'){
    out += `${s.cardio==='run'?'🏃 ランニング':'🚶 ウォーキング'}あり\n`;
  }
  (s.exercises||[]).forEach(ex=>{
    out += `\n■ ${ex.name}\n`;
    let wi = 0;
    (ex.sets||[]).forEach(set=>{
      const label = set.warmup ? 'アップ' : String(++wi);
      out += `  ${label}. ${setWeightLabel(set)}${set.reps!=null?` × ${set.reps}回`:''}\n`;
    });
  });
  if(s.next_menu && s.next_menu.focus){
    out += `\n次回: ${s.next_menu.focus}\n`;
  }
  return out;
}

function drawShareImage(s){
  const SC = 2, W = 640, PAD = 34;
  const rows = [];
  if(s.type==='cardio'){
    rows.push({t:'ex', text: s.cardio==='run'?'🏃 ランニング':'🚶 ウォーキング'});
  } else {
    (s.exercises||[]).forEach(ex=>{
      rows.push({t:'ex', text: ex.name});
      let wi = 0;
      (ex.sets||[]).forEach(set=>{
        const label = set.warmup ? 'アップ' : String(++wi);
        rows.push({t:'set', label, text: `${setWeightLabel(set)}${set.reps!=null?` × ${set.reps}回`:''}`});
      });
    });
  }
  const headerH = 108;
  const cardioH = (s.type!=='cardio' && s.cardio && s.cardio!=='none') ? 38 : 0;
  let bodyH = 12;
  rows.forEach(r=>{ bodyH += (r.t==='ex' ? 44 : 32); });
  const nextH = (s.next_menu && s.next_menu.focus) ? 56 : 0;
  const footerH = 52;
  const H = headerH + cardioH + bodyH + nextH + footerH + PAD;

  const c = document.createElement('canvas');
  c.width = W*SC; c.height = H*SC;
  const ctx = c.getContext('2d');
  ctx.scale(SC, SC);
  const FONT = '-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif';

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  const grad = ctx.createLinearGradient(0, 0, W, headerH);
  grad.addColorStop(0, '#f97316');
  grad.addColorStop(1, '#ea580c');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, headerH);
  ctx.fillStyle = '#ffffff';
  ctx.font = `700 30px ${FONT}`;
  ctx.fillText('💪 今日のトレーニング', PAD, 48);
  ctx.font = `400 21px ${FONT}`;
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  ctx.fillText(s.date || '', PAD, 82);

  let y = headerH + 32;
  if(cardioH){
    ctx.fillStyle = '#6b7a89';
    ctx.font = `400 20px ${FONT}`;
    ctx.fillText(`${s.cardio==='run'?'🏃 ランニング':'🚶 ウォーキング'}あり`, PAD, y);
    y += cardioH;
  }
  y += 6;
  rows.forEach(r=>{
    if(r.t==='ex'){
      ctx.fillStyle = '#1a2530';
      ctx.font = `700 24px ${FONT}`;
      ctx.fillText(r.text, PAD, y);
      y += 44;
    } else {
      ctx.fillStyle = r.label==='アップ' ? '#b45309' : '#9aa7b3';
      ctx.font = `700 17px ${FONT}`;
      ctx.fillText(r.label, PAD + 14, y - 4);
      ctx.fillStyle = '#3d4c5a';
      ctx.font = `400 20px ${FONT}`;
      ctx.fillText(r.text, PAD + 80, y - 4);
      y += 32;
    }
  });

  if(nextH){
    y += 6;
    ctx.strokeStyle = '#e3e8ee';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(PAD, y-12); ctx.lineTo(W-PAD, y-12); ctx.stroke();
    ctx.fillStyle = '#f97316';
    ctx.font = `700 20px ${FONT}`;
    ctx.fillText(`次回: ${s.next_menu.focus}`, PAD, y + 20);
    y += nextH;
  }

  ctx.fillStyle = '#b3bdc7';
  ctx.font = `400 16px ${FONT}`;
  ctx.fillText('筋トレAIコーチ', PAD, H - 24);
  return c;
}

async function shareSessionImage(s){
  const canvas = drawShareImage(s);
  const blob = await new Promise(res=>canvas.toBlob(res, 'image/png'));
  const file = new File([blob], `workout-${s.date||'record'}.png`, { type:'image/png' });
  if(navigator.canShare && navigator.canShare({ files:[file] })){
    try{
      await navigator.share({ files:[file] });
      return 'shared';
    }catch(err){
      if(err && err.name === 'AbortError') return 'aborted';
    }
  }
  state.shareImage = canvas.toDataURL('image/png');
  render();
  return 'preview';
}

function renderHistory(){
  const sessions = getSessions();

    let html = `<div class="card"><span class="detail-close" id="btnCloseDetail">閉じる ✕</span><div style="clear:both"></div></div>`;

    }
    html += `<div class="card"><button class="btn btn-ghost" id="btnDeleteSession">この記録を削除</button></div>`;
    return html;
  }
  if(sessions.length===0){
    return `<div class="empty">まだ記録がありません。<br>「記録」タブから最初のトレーニングを追加しましょう。</div>`;
  }
  let html = renderCalendar(sessions);
  html += '<div class="card">';
  sessions.slice().reverse().forEach(s=>{
    const cardioIcon = s.cardio==='run' ? '🏃' : (s.cardio==='walk' ? '🚶' : '');
    let summary;
    if(s.type==='cardio'){
      summary = `${s.cardio==='run'?'ランニング':'ウォーキング'}のみ（筋トレなし）`;
    } else {
      const names = (s.exercises||[]).map(e=>e.name).join('、');
      const nextFocus = s.next_menu ? `　→次回: ${s.next_menu.focus||''}` : '';
      summary = escapeHtml(names) + escapeHtml(nextFocus);

      <div class="hist-date">${escapeHtml(s.date||'')} ${cardioIcon}</div>
      <div class="hist-summary">${summary}</div>
    </div>`;
  });
  html += '</div>';
  return html;
}

function renderCalendar(sessions){
  if(state.calMonth===null || state.calMonth===undefined){
    const t = new Date();
    state.calMonth = t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0');
  }
  const [yStr, mStr] = state.calMonth.split('-');
  const year = parseInt(yStr,10), month = parseInt(mStr,10);

  // 日付ごとに記録を集約
  const byDate = {};
  sessions.forEach(s=>{
    if(!s.date) return;
    if(!byDate[s.date]) byDate[s.date] = { strength:false, cardio:null, ids:[] };
    if(s.type==='cardio'){
      if(!byDate[s.date].cardio) byDate[s.date].cardio = s.cardio;
    } else {
      byDate[s.date].strength = true;
      if(s.cardio && s.cardio!=='none' && !byDate[s.date].cardio) byDate[s.date].cardio = s.cardio;
    }
    byDate[s.date].ids.push(s.id);
  });

  const first = new Date(year, month-1, 1);
  const daysInMonth = new Date(year, month, 0).getDate();
  const startDow = first.getDay();

  // 当月の集計
  let cntStrength = 0, cntCardio = 0;
  Object.keys(byDate).forEach(d=>{
    if(d.startsWith(state.calMonth)){
      if(byDate[d].strength) cntStrength++;
      if(byDate[d].cardio) cntCardio++;
    }
  });

  let html = `<div class="card">
    <div class="cal-head">
      <button class="cal-nav" id="calPrev">‹</button>
      <div class="cal-title">${year}年${month}月</div>
      <button class="cal-nav" id="calNext">›</button>
    </div>
    <div class="cal-grid">`;
  ['日','月','火','水','木','金','土'].forEach((d,i)=>{
    html += `<div class="cal-dow${i===0?' sun':(i===6?' sat':'')}">${d}</div>`;
  });
  for(let i=0;i<startDow;i++){ html += `<div class="cal-cell empty"></div>`; }
  const today = todayStr();
  for(let day=1; day<=daysInMonth; day++){
    const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const rec = byDate[dateStr];
    const isToday = dateStr===today;
    let marks = '';
    if(rec){
      if(rec.strength) marks += `<span class="dot dot-strength"></span>`;
      if(rec.cardio) marks += `<span class="dot ${rec.cardio==='run'?'dot-run':'dot-walk'}"></span>`;
    }
    html += `<div class="cal-cell${rec?' has-rec':''}${isToday?' today':''}"${rec?` data-date="${dateStr}" data-id="${rec.ids[0]}"`:''}>
      <div class="cal-day">${day}</div>
      <div class="cal-marks">${marks}</div>
    </div>`;
  }
  html += `</div>
    <div class="cal-legend">
      <span><span class="dot dot-strength"></span>筋トレ ${cntStrength}日</span>
      <span><span class="dot dot-run"></span>ランニング</span>
      <span><span class="dot dot-walk"></span>ウォーキング</span>
      <span class="cal-legend-total">有酸素 ${cntCardio}日</span>
    </div>
  </div>`;
  return html;
}

function bindEvents(){
  document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));

  document.querySelectorAll('.gym-btn').forEach(b=>{
    b.onclick = ()=>{
      state.selectedGym = b.dataset.gym;
      localStorage.setItem(LS_KEY_LAST_GYM, b.dataset.gym);
      render();
    };
  });

  document.querySelectorAll('.cardio-btn').forEach(b=>{
    b.onclick = ()=>{ state.cardio = b.dataset.cardio; render(); };
  });

  const inputCardioDate = document.getElementById('inputCardioDate');
  if(inputCardioDate) inputCardioDate.onchange = ()=>{ state.cardioLogDate = inputCardioDate.value; };

  const btnLogCardioOnly = document.getElementById('btnLogCardioOnly');
  if(btnLogCardioOnly) btnLogCardioOnly.onclick = ()=>{
    if(state.cardio==='none'){
      state.error = '「なし」以外（ウォーキング or ランニング）を選んでから記録してください。';
      render();
      return;
    }
    try{
      const sessions = getSessions();
      const entry = {
        id: Date.now().toString(),
        type: 'cardio',
        date: state.cardioLogDate || todayStr(),
        cardio: state.cardio
      };
      sessions.push(entry);
      saveSessions(sessions);
      const msg = document.getElementById('cardioLogSaved');
      msg.style.display = 'block';
      setTimeout(()=>{ msg.style.display = 'none'; }, 1800);
    }catch(err){
      state.error = '記録に失敗しました: ' + err.message;
      render();
    }
  };

  const btnAddRow = document.getElementById('btnAddRow');
  if(btnAddRow) btnAddRow.onclick = ()=>{
    state.entryRows = collectEntryRows();
    state.entryRows.push(emptyRow());
    render();
  };

  const btnResetRows = document.getElementById('btnResetRows');
  if(btnResetRows) btnResetRows.onclick = ()=>{
    state.entryRows = buildInitialEntryRows();
    render();
  };

  document.querySelectorAll('.entry-del').forEach(b=>{
    b.onclick = ()=>{
      const rows = collectEntryRows();
      rows.splice(parseInt(b.dataset.i,10), 1);
      state.entryRows = rows.length ? rows : [emptyRow()];
      render();
    };
  });

  document.querySelectorAll('.set-add').forEach(b=>{
    b.onclick = ()=>{
      const rows = collectEntryRows();
      rows[parseInt(b.dataset.i,10)].sets.push(emptySet());
      state.entryRows = rows;
      render();
    };
  });

  document.querySelectorAll('.set-del').forEach(b=>{
    b.onclick = ()=>{
      const rows = collectEntryRows();
      const row = rows[parseInt(b.dataset.i,10)];
      row.sets.splice(parseInt(b.dataset.j,10), 1);
      if(row.sets.length===0) row.sets.push(emptySet());
      state.entryRows = rows;
      render();
    };
  });

  const btnCopyPrompt = document.getElementById('btnCopyPrompt');
  if(btnCopyPrompt) btnCopyPrompt.onclick = async ()=>{
    state.entryRows = collectEntryRows();
    const prompt = buildPrompt(state.selectedGym, state.cardio, entryRowsToText(state.entryRows));
    await copyToClipboard(prompt);
    const msg = document.getElementById('copyDone');
    msg.style.display='block';
    setTimeout(()=>{ msg.style.display='none'; }, 1800);
  };

  const btnParse = document.getElementById('btnParse');
  if(btnParse) btnParse.onclick = ()=>{
    const raw = document.getElementById('inputPaste').value;
    try{
      const result = parseClaudeJson(raw);
      state.pendingResult = result;
      state.error = null;
      render();
    }catch(e){
      state.error = '解析に失敗しました。貼り付けた内容がJSON形式か確認してください。';
      render();
    }
  };

  const btnSave = document.getElementById('btnSave');
  if(btnSave) btnSave.onclick = ()=>{
    try{
      const sessions = getSessions();
      const result = state.pendingResult;
      result.id = Date.now().toString();
      result.cardio = state.cardio || 'none';
      sessions.push(result);
      saveSessions(sessions);
      const check = getSessions();
      if(!check.some(s=>s.id===result.id)){
        throw new Error('保存を確認できませんでした');
      }
      state.pendingResult = null;
      switchTab('history');
    }catch(err){
      state.error = '保存に失敗しました: ' + err.message + '（プライベートブラウズモードや、ストレージ容量の上限が原因の可能性があります）';
      render();
    }
  };

  const btnDiscard = document.getElementById('btnDiscard');
  if(btnDiscard) btnDiscard.onclick = ()=>{ state.pendingResult=null; render(); };

  const btnSaveSettings = document.getElementById('btnSaveSettings');
  if(btnSaveSettings) btnSaveSettings.onclick = ()=>{
    localStorage.setItem(LS_KEY_CONDITION, document.getElementById('inputCondition').value.trim());
    const msg = document.getElementById('settingsSaved');
    msg.style.display='block';
    setTimeout(()=>{ msg.style.display='none'; }, 1800);
  };

  const btnSaveEquip = document.getElementById('btnSaveEquip');
  if(btnSaveEquip) btnSaveEquip.onclick = ()=>{
    localStorage.setItem(LS_KEY_GYM_EQUIP_1, document.getElementById('inputEquip1').value.trim());
    localStorage.setItem(LS_KEY_GYM_EQUIP_2, document.getElementById('inputEquip2').value.trim());
    const msg = document.getElementById('equipSaved');
    msg.style.display='block';
    setTimeout(()=>{ msg.style.display='none'; }, 1800);
  };

  document.querySelectorAll('.hist-item').forEach(el=>{
    el.onclick = ()=>{
      const sessions = getSessions();
      state.viewingSession = sessions.find(s=>s.id===el.dataset.id);
      state.shareImage = null;
      render();
    };
  });

  const calPrev = document.getElementById('calPrev');
  if(calPrev) calPrev.onclick = ()=>{ state.calMonth = shiftMonth(state.calMonth, -1); render(); };
  const calNext = document.getElementById('calNext');
  if(calNext) calNext.onclick = ()=>{ state.calMonth = shiftMonth(state.calMonth, 1); render(); };

  document.querySelectorAll('.cal-cell.has-rec').forEach(el=>{
    el.onclick = ()=>{
      const sessions = getSessions();
      state.viewingSession = sessions.find(s=>s.id===el.dataset.id);
      state.shareImage = null;
      render();
    };
  });
  const btnShareImg = document.getElementById('btnShareImg');
  if(btnShareImg) btnShareImg.onclick = async ()=>{
    const s = shareTargetSession();
    if(!s) return;
    const msg = document.getElementById('shareMsg');
    try{
      const res = await shareSessionImage(s);
      if(res === 'shared'){
        const m = document.getElementById('shareMsg');
        if(m){ m.textContent = '✓ 共有しました'; m.style.display = 'block';
          setTimeout(()=>{ m.style.display='none'; }, 1800); }
      }
    }catch(err){
      if(msg){ msg.textContent = '画像の生成に失敗しました: ' + err.message;
        msg.style.color = 'var(--danger)'; msg.style.display = 'block'; }
    }
  };

  const btnShareText = document.getElementById('btnShareText');
  if(btnShareText) btnShareText.onclick = async ()=>{
    const s = shareTargetSession();
    if(!s) return;
    await copyToClipboard(buildShareText(s));
    const msg = document.getElementById('shareMsg');
    msg.textContent = '✓ テキストをコピーしました';
    msg.style.display = 'block';
    setTimeout(()=>{ msg.style.display='none'; }, 1800);
  };

  const btnCloseDetail = document.getElementById('btnCloseDetail');
  if(btnCloseDetail) btnCloseDetail.onclick = ()=>{ state.viewingSession=null; render(); };

  const btnDeleteSession = document.getElementById('btnDeleteSession');
  if(btnDeleteSession) btnDeleteSession.onclick = ()=>{
    if(!confirm('この記録を削除しますか？')) return;
    const sessions = getSessions().filter(s=>s.id!==state.viewingSession.id);
    saveSessions(sessions);
    state.viewingSession = null;
    render();
  };
}

async function copyToClipboard(text){
  if(navigator.clipboard && window.isSecureContext){
    try{ await navigator.clipboard.writeText(text); return; }catch(e){ /* fall through */ }
  }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
}

function parseClaudeJson(text){
  let t = text.trim();
  t = t.replace(/^```json\s*/i, '').replace(/^```\s*/, '').replace(/```\s*$/, '');
  return JSON.parse(t);
}

function buildPrompt(gymId, cardio, workoutText){
  const sessions = getSessions().slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).slice(-5);
  let historyText = 'なし（初回の記録です）';
  if(sessions.length>0){
    historyText = sessions.map(s=>{
      if(s.type==='cardio'){
        return `${s.date}: 有酸素のみ（${CARDIO_LABELS[s.cardio]||s.cardio}）、筋トレなし`;
      }
      const names = (s.exercises||[]).map(e=>e.name).join('、');
      const cat = s.next_menu && s.next_menu.category ? s.next_menu.category : '不明';
      const cardioLabel = CARDIO_LABELS[s.cardio] || '記録なし';
      return `${s.date}: [${names}] 前回提案カテゴリ=${cat} / その日の有酸素=${cardioLabel} / 評価メモ: ${(s.evaluation||'').slice(0,80)}`;
    }).join('\n');
  }
  const gymName = GYM_NAMES[gymId];
  const gymEquip = getGymEquip(gymId);
  const cardioLabel = CARDIO_LABELS[cardio] || 'なし';
  const intro = workoutText
    ? `あなたは経験豊富なパーソナルトレーナーです。以下の「今日のトレーニング内容」をもとに、評価と次回のトレーニングメニューを提案してください。

【今日のトレーニング内容】（${todayStr()}）
${workoutText}`
    : `あなたは経験豊富なパーソナルトレーナーです。添付した「筋トレMEMO」のサマリー画面の写真から、その日のトレーニング内容を正確に読み取り、評価と次回のトレーニングメニューを提案してください。`;
  return `${intro}

【ユーザー情報】
${getCondition()}
腹筋(アブドミナル、ロータリートルソー等)は自宅で別途鍛えているため、ジムでの提案は控えめにしてください（must_exercisesには含めず、optional_exercisesに含める場合も1種目までにする）。

【3分割ローテーション】
次回メニューのfocus/categoryは、必ず以下の3カテゴリのいずれか1つにしてください。
- "Push": 胸・三頭筋・三角筋前部
- "Pull": 背中(広背筋・僧帽筋)・二頭筋・三角筋後部
- "Legs+": 三角筋中部・脚・その他
直近のセッション履歴にある「前回提案カテゴリ」を参照し、同じカテゴリが連続しないよう、バランスよくローテーションしてください。

【直近のセッション履歴（参考・漸進性とローテーション判断に使用）】
${historyText}

【今日の有酸素運動】${cardioLabel}
ランニングをした日は脚トレを行わない方針です。今日ランニングをしている場合、今回のトレーニング内容に脚種目が含まれていれば評価コメントで軽く触れてください。また、次回メニューのカテゴリが"Legs+"になる場合は、notesに必ず「ランニングをする予定の日は脚トレを避けてください」という趣旨の注意を含めてください。

【次回トレーニングを行うジム】${gymName}
【このジムの設備】
${gymEquip}
次回メニューの種目は、必ず上記の設備のみで実施できるものにしてください。設備にない種目は提案しないでください。

【出力ルール】
以下のJSON形式のみを出力してください。説明文やMarkdownのコードフェンス(\`\`\`)は一切付けないでください。
{
  "date": "${workoutText ? todayStr() : '画像内の日付(YYYY-MM-DD)。読み取れない場合は今日の日付'}",
  "exercises": [
    {"name": "種目名", "sets": [{"weight": 数値kg(自重の場合はnull), "reps": 数値, "warmup": ウォームアップセットならtrue、通常セットはfalse}], "maxRM": その種目の最大推定1RM(数値、なければnull)}
  ],
  "evaluation": "このセッションの評価。前回までの履歴と比較した進捗、頑張った点、フォームや強度に関する注意点などを2〜4文で。日本語。",
  "next_menu": {
    "gym": "${gymName}",
    "category": "Push または Pull または Legs+ のいずれか",
    "focus": "次回トレーニングの部位・テーマ（例: 背中・二頭筋中心）",
    "must_exercises": [
      {"name": "種目名（必ず上記設備リストにあるもののみ）", "target": "目安（例: 3-4セット×10-15回、22kg前後から開始）", "rest": "セット間のレスト時間（例: 60秒）", "warmup": {"weight": ウォームアップ推奨重量(数値kg)、不要な種目はnull, "reps": 推奨回数(数値)、不要ならnull}}
    ],
    "optional_exercises": [
      {"name": "種目名（必ず上記設備リストにあるもののみ）", "target": "目安", "rest": "レスト時間", "warmup": {"weight": 数値またはnull, "reps": 数値またはnull}}
    ],
    "notes": "怪我への配慮、漸進性、フォームなどに関する補足を1〜2文で。"
  }
}
must_exercisesは「絶対にやるべき種目」を必ず4種目、optional_exercisesは「時間があればやる種目」を必ず4種目、合計8種目ちょうどにしてください。それ以上の種目数は提案しないでください。全種目に必ずrest（レスト時間）を明記してください。

【ウォームアップについて】
高重量を扱う種目や、いきなり本番重量に入ると怪我のリスクがある種目（コンパウンド種目・胸/背中/脚の主要種目など）には、warmupにアップセットの推奨重量と回数を入れてください（本番重量の40〜60%程度 × 10〜15回が目安）。軽量の単関節種目やマシンの補助種目などアップが不要な種目は、warmupのweight・repsをnullにしてください。

【評価について】
今日のトレーニングはセットごとに重量・回数が記録されています。セット間の重量の落ち方（後半で重量や回数が落ちているか）にも触れ、次回の重量設定の参考になるコメントをしてください。`;
}

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function shiftMonth(ym, delta){
  const [y, m] = ym.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}

render();
