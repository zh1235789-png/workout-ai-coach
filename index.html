<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f97316">
<title>筋トレAIコーチ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💪</text></svg>">
<style>
:root{
  --bg:#f4f6f8; --card:#ffffff; --text:#1a2530; --sub:#6b7a89;
  --accent:#f97316; --accent-soft:#ffe3cc; --border:#e3e8ee;
  --warn:#b45309; --warn-bg:#fef3c7; --danger:#dc2626; --danger-bg:#fee2e2;
  --ok:#16a34a; --ok-bg:#dcfce7;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1519; --card:#1a2229; --text:#e8edf2; --sub:#8b9aa8;
    --accent:#fb923c; --accent-soft:#4a2c12; --border:#2a343d;
    --warn:#fbbf24; --warn-bg:#3a2e10; --danger:#f87171; --danger-bg:#3d1a1a;
    --ok:#4ade80; --ok-bg:#0f2e1c;
  }
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* iOS Safariの既定ボタン描画を打ち消す（文字色・フォントが上書きされるのを防ぐ） */
button{-webkit-appearance:none;appearance:none;font-family:inherit;color:inherit;background:none;border:none}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text);padding-bottom:calc(72px + env(safe-area-inset-bottom))}
body.timer-on{padding-bottom:calc(140px + env(safe-area-inset-bottom))}
header{background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;position:sticky;top:0;z-index:10}
header h1{font-size:17px;font-weight:700}
header .sub{color:rgba(255,255,255,.85);font-size:12px;margin-top:2px}
main{padding:14px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.sub{color:var(--sub);font-size:12px;line-height:1.5}
.btn{display:block;width:100%;padding:13px;border-radius:12px;border:none;font-size:15px;font-weight:700;text-align:center;cursor:pointer}
.btn-primary{background:var(--accent);color:#fff}
.btn-secondary{background:var(--accent-soft);color:var(--accent)}
.btn-ghost{background:transparent;color:var(--sub);border:1px solid var(--border)}
.btn[disabled]{opacity:.5}
.btn + .btn{margin-top:10px}
input[type=text],input[type=password],input[type=number],input[type=date],textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;font-family:inherit}
textarea{resize:vertical;min-height:80px}
label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px;font-weight:600}
.field{margin-bottom:14px}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 0;border:none;border-radius:8px;background:transparent;color:var(--sub);font-size:13px;font-weight:600}
.seg button.sel{background:var(--card);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.step-num{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.center-msg{text-align:center;color:var(--sub);font-size:13px;padding:8px 0}
.ex-row{padding:9px 0;border-bottom:1px solid var(--border)}
.ex-row:last-child{border-bottom:none}
.ex-name{font-weight:700;font-size:14px;margin-bottom:3px}
.ex-sets{font-size:12.5px;color:var(--sub);line-height:1.6}
.ex-max{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;margin-left:6px}
.eval-box{background:var(--accent-soft);border-radius:10px;padding:12px;font-size:13.5px;line-height:1.7;color:var(--text)}
.menu-focus{font-weight:700;font-size:15px;color:var(--accent);margin-bottom:8px}
.menu-group-label{font-size:11.5px;font-weight:700;color:var(--sub);margin:10px 0 2px}
.menu-ex{padding:9px 0;border-bottom:1px dashed var(--border);font-size:13.5px}
.menu-ex:last-child{border-bottom:none}
.menu-ex .n{font-weight:600;line-height:1.45;overflow-wrap:anywhere}
.menu-ex .t{color:var(--sub);font-size:12.5px;line-height:1.5;margin-top:3px;overflow-wrap:anywhere}
.menu-warm{font-size:11px;color:var(--warn);font-weight:normal;margin-top:3px}
.menu-notes{margin-top:10px;background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:9px 10px;font-size:12.5px;line-height:1.6}
/* workout entry */
.entry-row{padding:10px 0;border-bottom:1px solid var(--border)}
.entry-row:last-child{border-bottom:none}
.entry-head{display:flex;gap:6px;align-items:center}
.entry-name{flex:1}
.entry-hint{font-size:11px;color:var(--sub);margin:5px 0 2px}
.entry-del{background:transparent;border:1px solid var(--border);color:var(--sub);border-radius:8px;width:34px;height:38px;font-size:13px;flex-shrink:0;cursor:pointer}
.row-move{background:transparent;border:1px solid var(--border);color:var(--sub);border-radius:8px;width:30px;height:38px;font-size:14px;flex-shrink:0;cursor:pointer}
.row-move[disabled]{opacity:.3}
.set-row{display:flex;align-items:center;gap:5px;margin-top:6px}
.set-row input{padding:8px;font-size:13px;text-align:center;min-width:0;flex:1}
.set-label{width:40px;flex-shrink:0;font-size:11.5px;font-weight:700;color:var(--sub);text-align:center}
.set-label.warm{color:var(--warn);font-size:10.5px}
/* セット番号をタップするとアップ切替になるボタン */
.warm-toggle,.ed-warm-toggle{background:var(--bg);border:1px solid var(--border);border-radius:7px;height:34px;padding:0;cursor:pointer}
.warm-toggle.warm,.ed-warm-toggle.warm{background:var(--warn-bg);border-color:var(--warn)}
.entry-x{color:var(--sub);font-size:12px}
.set-del{background:transparent;border:1px solid var(--border);color:var(--sub);border-radius:8px;width:30px;height:34px;font-size:15px;flex-shrink:0;cursor:pointer;line-height:1}
.set-add{background:transparent;border:1px dashed var(--border);color:var(--sub);border-radius:8px;padding:6px 0;width:100%;font-size:12px;margin-top:7px;cursor:pointer}
.warm-hint{font-size:11px;color:var(--warn);margin:3px 0 0 43px}
.share-preview{width:100%;border-radius:10px;border:1px solid var(--border);margin-top:12px;display:block}
/* weekly volume */
.vol-row{display:flex;align-items:center;gap:8px;padding:5px 0}
.vol-part{width:34px;flex-shrink:0;font-size:12.5px;font-weight:700}
.vol-bar{flex:1;height:9px;background:var(--bg);border-radius:5px;overflow:hidden}
.vol-fill{display:block;height:100%;background:var(--border);border-radius:5px}
.vol-fill.low{background:#eab308}
.vol-fill.good{background:#16a34a}
.vol-fill.over{background:#dc2626}
.vol-num{width:74px;flex-shrink:0;text-align:right;font-size:12.5px;font-weight:700;color:var(--sub)}
.vol-num.low{color:#eab308}.vol-num.good{color:#16a34a}.vol-num.over{color:#dc2626}
.vol-prev{font-weight:normal;font-size:10.5px;color:var(--sub)}
.vol-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:10.5px;color:var(--sub);align-items:center}
.vol-dot-low{background:#eab308}.vol-dot-good{background:#16a34a}.vol-dot-over{background:#dc2626}
/* RPE */
.rpe-row{display:flex;align-items:center;gap:8px;margin-top:8px}
.rpe-label{font-size:11.5px;color:var(--sub);font-weight:600;flex-shrink:0}
.rpe-select{flex:1;min-width:0;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:12.5px;font-family:inherit}
/* pain score */
.pain-row{display:flex;gap:3px}
.pain-btn{flex:1;min-width:0;padding:9px 0;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:12px;font-weight:700;cursor:pointer}
.pain-btn.sel{color:#fff;border-color:transparent}
.pain-note{margin-top:9px;font-size:12.5px;padding:8px 10px;border-radius:8px;line-height:1.55}
.pain-note.ok{background:var(--ok-bg);color:var(--ok)}
.pain-note.warn{background:var(--warn-bg);color:var(--warn)}
.pain-note.danger{background:var(--danger-bg);color:var(--danger)}
/* body metrics & charts */
.body-row{display:flex;gap:6px}
.body-row input{flex:1;min-width:0;padding:9px;font-size:13px}
.chart{width:100%;height:130px;display:block}
.chart .grid{stroke:var(--border);stroke-width:1}
.chart .axis{fill:var(--sub);font-size:9px}
.chart-single{color:var(--sub);font-size:13px;padding:10px 0}
.chart-single span{display:block;font-size:11.5px;margin-top:4px}
/* exercise picker */
.picker-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.picker-sheet{background:var(--card);width:100%;max-width:560px;max-height:82vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.picker-head{display:flex;gap:8px;padding:12px;border-bottom:1px solid var(--border);flex-shrink:0}
.picker-head input{flex:1}
.picker-body{overflow-y:auto;padding:8px 12px 16px}
.picker-group{font-size:11.5px;font-weight:700;color:var(--sub);margin:12px 0 6px}
.picker-items{display:flex;flex-wrap:wrap;gap:6px}
.picker-item{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:999px;padding:8px 13px;font-size:13px;cursor:pointer}
.picker-empty{color:var(--sub);font-size:13px;text-align:center;padding:24px 0}
.custom-chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:6px 8px 6px 13px;font-size:13px}
.custom-del{background:transparent;border:none;color:var(--sub);font-size:12px;cursor:pointer;padding:2px 4px;line-height:1}
/* rest timer */
.timer-bar{position:fixed;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 6px 22px rgba(0,0,0,.22);display:flex;align-items:center;gap:7px;padding:10px 12px;z-index:30;overflow:hidden}
.timer-time{font-size:25px;font-weight:700;flex:1;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.timer-bar.done{border-color:var(--ok)}
.timer-bar.done .timer-time{color:var(--ok)}
.timer-btn{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:8px 10px;font-size:12.5px;font-weight:600;cursor:pointer;flex-shrink:0}
.timer-progress{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--accent)}
.timer-bar.done .timer-progress{background:var(--ok)}
.preset-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.preset-grid button{padding:11px 0;border-radius:9px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:13px;font-weight:600;cursor:pointer}
.set-timer{background:transparent;border:1px solid var(--border);color:var(--sub);border-radius:8px;width:32px;height:34px;font-size:13px;flex-shrink:0;cursor:pointer}
/* edit form */
.ed-menu{padding:10px 0;border-bottom:1px dashed var(--border)}
.ed-menu:last-of-type{border-bottom:none}
.ed-menu-nums{display:flex;gap:5px;margin-top:6px}
.ed-menu-nums input{flex:1;min-width:0;padding:8px;font-size:12.5px}
.ed-menu-nums .ed-m-rest{flex:1.4}
/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-title{font-size:15px;font-weight:700}
.cal-nav{background:transparent;border:1px solid var(--border);color:var(--text);width:34px;height:30px;border-radius:8px;font-size:17px;line-height:1;cursor:pointer}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{text-align:center;font-size:10.5px;color:var(--sub);font-weight:700;padding:3px 0}
.cal-dow.sun{color:#f87171}
.cal-dow.sat{color:#60a5fa}
.cal-cell{min-height:38px;border-radius:7px;padding:3px 0 2px;display:flex;flex-direction:column;align-items:center;gap:2px}
.cal-cell.empty{min-height:0}
.cal-cell.has-rec{background:var(--bg);cursor:pointer}
.cal-cell.today{outline:1.5px solid var(--accent)}
.cal-day{font-size:12px;line-height:1.2}
.cal-cell.has-rec .cal-day{font-weight:700}
.cal-marks{display:flex;gap:2px;min-height:7px}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.dot-strength{background:var(--accent)}
.dot-run{background:#ef4444}
.dot-walk{background:#3b82f6}
.cal-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:11px;color:var(--sub)}
.cal-legend span{display:flex;align-items:center;gap:4px}
.cal-legend-total{margin-left:auto;font-weight:700}
.hist-item{padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer}
.hist-item:last-child{border-bottom:none}
.hist-date{font-weight:700;font-size:14px}
.hist-summary{color:var(--sub);font-size:12.5px;margin-top:3px}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:40px 10px}
.err-box{background:var(--danger-bg);color:var(--danger);border-radius:10px;padding:11px;font-size:13px;margin-bottom:12px;line-height:1.6}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tabbar button{flex:1;background:none;border:none;padding:10px 0 8px;color:var(--sub);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar button .ic{font-size:20px}
.tabbar button.sel{color:var(--accent)}
.detail-close{float:right;color:var(--sub);font-size:13px}
.saved-badge{display:inline-block;background:var(--ok-bg);color:var(--ok);font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;margin-bottom:10px}
</style>
</head>
<body>
<header>
  <h1>💪 筋トレAIコーチ</h1>
  <div class="sub" id="headerSub">Claudeチャットと連携して評価&次回メニューを記録</div>
</header>
<main id="app"></main>
<datalist id="exList"></datalist>
<div id="pickerOverlay" class="picker-overlay" style="display:none">
  <div class="picker-sheet">
    <div class="picker-head">
      <input type="text" id="pickerSearch" placeholder="種目名で検索" autocomplete="off">
      <button class="timer-btn" id="pickerClose">✕</button>
    </div>
    <div class="picker-body" id="pickerBody"></div>
  </div>
</div>
<div id="timerBar" class="timer-bar" style="display:none">
  <div class="timer-time" id="timerTime">0:00</div>
  <button class="timer-btn" id="timerAdd">+30秒</button>
  <button class="timer-btn" id="timerToggle">一時停止</button>
  <button class="timer-btn" id="timerStop">✕</button>
  <div class="timer-progress" id="timerProgress"></div>
</div>
<nav class="tabbar">
  <button data-tab="home" class="tab-btn"><span class="ic">📝</span>記録</button>
  <button data-tab="history" class="tab-btn"><span class="ic">📋</span>履歴</button>
  <button data-tab="trends" class="tab-btn"><span class="ic">📈</span>推移</button>
  <button data-tab="settings" class="tab-btn"><span class="ic">⚙️</span>設定</button>
</nav>

<script>
const LS_KEY_SESSIONS = 'wac_sessions';
const LS_KEY_CONDITION = 'wac_condition';
const LS_KEY_GYM_EQUIP_1 = 'wac_gym_equip_1';
const LS_KEY_GYM_EQUIP_2 = 'wac_gym_equip_2';
const LS_KEY_LAST_GYM = 'wac_last_gym';
const LS_KEY_CUSTOM_EX = 'wac_custom_exercises';
const LS_KEY_BODY = 'wac_body';
const LS_KEY_LAST_BACKUP = 'wac_last_backup';
const BACKUP_KEYS = [LS_KEY_SESSIONS, LS_KEY_CONDITION, LS_KEY_GYM_EQUIP_1, LS_KEY_GYM_EQUIP_2, LS_KEY_LAST_GYM, LS_KEY_CUSTOM_EX, LS_KEY_BODY];
const DEFAULT_CONDITION = '左ハムストリング肉離れ(2026-07-04受傷)からリハビリ中。脚トレは控えめ・痛みが出ない範囲で漸進的に。目的は健康維持・筋力向上・体脂肪率の低下。筋トレ週3-4回、有酸素運動(ランニング・ウォーキング)週3-4回。';

const GYM_NAMES = { '1': 'エニタイムフィットネス志村坂上店', '2': 'エニタイムフィットネス文京本郷店（本郷三丁目）' };
const CARDIO_LABELS = { 'none': 'なし', 'walk': 'ウォーキング', 'run': 'ランニング' };
const DEFAULT_EQUIP_1 = `【マシン種目】チェストプレス、インクラインプレス、ペクトラルフライ、リアデルトフライ、ショルダープレス、DPLショルダープレス、ラテラルレイズ、シーテッドロウ、DPLシーテッドロウ、プルダウン、Tバーロウ、ディップ、チンニング、プリチャーカール、シーテッドアームカール、ロータリートルソー、アブドミナル、レッグエクステンション、レッグカール、レッグプレス、アングルドレッグプレス、インナーサイ、アウターサイ、グルートブリッジ、ハックスクワット、アイソラテラル系マシン各種
【フリーウェイト種目（パワーラック・スミスマシン・ダンベル・ベンチ）】ベンチプレス、インクラインベンチプレス、ダンベルベンチプレス、インクラインダンベルプレス、ダンベルフライ、スミスベンチプレス、スミスインクラインプレス、バーベルロウ、ダンベルロウ、ワンハンドロウ、デッドリフト、ルーマニアンデッドリフト、シュラッグ、ダンベルプルオーバー、バーベルショルダープレス、ダンベルショルダープレス、アーノルドプレス、サイドレイズ、フロントレイズ、リアレイズ、リアデルトフライ、アップライトロウ、バーベルカール、ダンベルカール、ハンマーカール、インクラインカール、コンセントレーションカール、スカルクラッシャー、フレンチプレス、キックバック、スクワット、スミススクワット、フロントスクワット、ブルガリアンスクワット、ランジ、ヒップスラスト、カーフレイズ
【ケーブルマシン種目】ケーブルフライ、ケーブルクロスオーバー、ケーブルロウ、ラットプルダウン、ストレートアームプルダウン、フェイスプル、ケーブルサイドレイズ、ケーブルリアデルトフライ、ケーブルカール、トライセップスプレスダウン、ケーブルキックバック、ケーブルクランチ
【保有器具】パワーラック(2台)、スミスマシン、デッドリフトエリート、ケーブルマシン、ダンベル(1〜50kg)、アジャスタブルベンチ(3台)、フラットベンチ、バランスボール、ゴムチューブ、ストレッチポール
【有酸素】ステアクライマー、トレッドミル(8台)、リカンベントバイク(2台)、アップライトバイク(2台)、クロストレーナー(2台)`;

const DEFAULT_EQUIP_2 = `【マシン種目(PRECOR製)】チェストプレス、ペクトラルフライ、ショルダープレス、ディップ、チンニング、バイセップカール、シーテッドロー、ラットプルダウン、バックエクステンション、アブドミナル、ロータリートルソー、腹筋台、背筋台、レッグプレス、レッグカール、レッグエクステンション、インナーサイ、アウターサイ ※トライセップエクステンションのマシンは無し

function getLastStrengthSession(){

  return sessions.sort((a,b)=>(a.date||'').localeCompare(b.date||''))[sessions.length-1];
}

// RPE: 主観的運動強度。10=これ以上1回も挙がらない、8=あと2回できた、など
const RPE_OPTIONS = [
  ['', '未入力'],
  ['10', '10 限界（あと0回）'],
  ['9.5', '9.5 あと0〜1回'],
  ['9', '9 あと1回'],
  ['8.5', '8.5 あと1〜2回'],
  ['8', '8 あと2回'],
  ['7', '7 あと3回'],
  ['6', '6 あと4回以上'],
  ['5', '5 かなり余裕']
];

function rpeOptions(selected){
  return RPE_OPTIONS.map(([v,label])=>
    `<option value="${v}"${String(selected||'')===v?' selected':''}>${escapeHtml(label)}</option>`
  ).join('');
}

function emptySet(){ return { weight:'', reps:'', warmup:false }; }
function emptyRow(){ return { name:'', sets:[emptySet(), emptySet(), emptySet()], rpe:'' }; }

function buildInitialEntryRows(){
  const last = getLastStrengthSession();
  const nm = last && last.next_menu;
  const items = [];
  if(nm){
    (nm.must_exercises||[]).forEach(e=>{ if(e.name) items.push(e); });
    (nm.optional_exercises||[]).forEach(e=>{ if(e.name) items.push(e); });
  }
  if(items.length===0){
    state.entryRowsFromMenu = false;
    return [emptyRow(), emptyRow(), emptyRow(), emptyRow()];
  }
  state.entryRowsFromMenu = true;
  return items.map(e=>{
    const w = e.warmup;
    const warm = (w && (w.weight!=null || w.reps!=null)) ? w : null;
    const sets = [];
    if(warm){
      sets.push({ weight: warm.weight!=null?String(warm.weight):'', reps: warm.reps!=null?String(warm.reps):'', warmup:true });
    }
    const n = countTargetSets(e.target);
    for(let i=0;i<n;i++) sets.push(emptySet());
    return { name: e.name, sets, rpe:'', hint: e.target||'', warmupHint: warm ? formatWarmupHint(warm) : '', restSec: parseRestSeconds(e.rest) || '' };
  });
}

function countTargetSets(target){
  if(!target) return 3;
  const m = String(target).match(/(\d+)\s*(?:[-〜~]\s*(\d+))?\s*セット/);
  if(m) return Math.min(6, parseInt(m[2]||m[1], 10) || 3);
  return 3;
}

function formatWarmupHint(w){
  if(!w) return '';
  const wt = w.weight!=null ? `${w.weight}kg` : '';
  const rp = w.reps!=null ? `${w.reps}回` : '';
  return [wt, rp].filter(Boolean).join(' × ');
}

function collectEntryRows(){
  const rows = [];
  document.querySelectorAll('.entry-row').forEach(el=>{
    const sets = [];
    el.querySelectorAll('.set-row').forEach(sEl=>{
      sets.push({
        weight: sEl.querySelector('.set-weight').value,
        reps: sEl.querySelector('.set-reps').value,
        warmup: sEl.dataset.warmup === '1'
      });
    });
    const rpeEl = el.querySelector('.rpe-select');
    rows.push({
      name: el.querySelector('.entry-name').value,
      sets,
      rpe: rpeEl ? rpeEl.value : '',
      hint: el.dataset.hint || '',
      warmupHint: el.dataset.warmupHint || '',
      restSec: el.dataset.restSec || ''
    });
  });
  return rows;
}

function entryRowsToText(rows){
  // 本番セット（アップ以外）が1つでも入力されている種目のみ「実施した」とみなす
  const done = rows.filter(r=>r.name.trim() && r.sets.some(s=>!s.warmup && (s.weight!=='' || s.reps!=='')));
  if(done.length===0) return null;
  return done.map(r=>{
    let workIdx = 0;
    const lines = r.sets
      .filter(s=>s.weight!=='' || s.reps!=='')
      .map(s=>{
        const wPart = s.weight!=='' ? `${s.weight}kg` : '自重';
        const rPart = s.reps!=='' ? ` × ${s.reps}回` : '';
        const label = s.warmup ? 'アップ' : 'セット'+(++workIdx);
        return `    ${label}: ${wPart}${rPart}`;
      });
    const rpe = r.rpe ? `（最終セットRPE ${r.rpe}）` : '';
    return `- ${r.name.trim()}${rpe}\n${lines.join('\n')}`;
  }).join('\n');
}

/* ===== 種目ピッカー ===== */
function parseEquipGroups(text){
  const groups = [];
  const re = /【([^】]+)】([^【]*)/g;
  let m;
  while((m = re.exec(text))){
    // 「※〜」の注記は候補に含めない
    const body = m[2].split('※')[0];
    const items = body.split(/[、,，\n]/)
      .map(s=>s.replace(/[(（][^)）]*[)）]/g, '').trim())
      .filter(s=>s && s.length <= 24);
    if(items.length) groups.push({ group: m[1], items });
  }
  return groups;
}

  // 肩・腕は胸より先に判定（リアデルトフライ→肩、インクラインカール→腕 のため）
  { part:'肩',   re:/ショルダー|レイズ|デルト|フェイスプル|アップライト|アーノルド/ },
  { part:'腕',   re:/カール|トライセップ|バイセップ|スカルクラッシャー|フレンチプレス|キックバック|プレスダウン|プリチャー/ },
  { part:'胸',   re:/チェスト|ペクトラル|フライ|クロスオーバー|ディップ|ベンチプレス|インクライン|デクライン|プッシュアップ|腕立て/ },
  { part:'背中', re:/プルダウン|ラットプル|ロウ|ロー|チンニング|チンアップ|懸垂|デッドリフト|Tバー|バックエクステンション|背筋|プルオーバー|プルアップ|シュラッグ/ },
  { part:'腕',   re:/カール|トライセップ|バイセップ|プレスダウン|キックバック|プリチャー|アーム|エクステンション|スカルクラッシャー|フレンチプレス/ }
];
const BODY_PART_ORDER = ['胸','背中','肩','腕','脚','体幹','その他'];

function bodyPartOf(name){
  for(const r of BODY_PART_RULES){ if(r.re.test(name)) return r.part; }
  return 'その他';
}

function rememberExerciseNames(names){
  const known = new Set();
  const gymId = state.selectedGym || getLastGym();
  ['1','2'].forEach(id=>parseEquipGroups(getGymEquip(id)).forEach(g=>g.items.forEach(n=>known.add(n))));
  const custom = getCustomExercises();
  const set = new Set(custom);
  let changed = false;
  (names||[]).forEach(raw=>{
    const n = String(raw||'').trim();
    if(!n || n.length > 24) return;
    if(known.has(n) || set.has(n)) return;
    set.add(n); custom.push(n); changed = true;
  });

}

function exercisePickerGroups(){
  const gymId = state.selectedGym || getLastGym();
  const names = [];
  parseEquipGroups(getGymEquip(gymId))
    .filter(g=>!/有酸素/.test(g.group))
    .forEach(g=>g.items.forEach(n=>names.push(n)));
  getCustomExercises().forEach(n=>names.push(n));

  const seen = new Set();
  const byPart = {};
  names.forEach(n=>{
    if(seen.has(n)) return;
    seen.add(n);
    const p = bodyPartOf(n);
    (byPart[p] = byPart[p] || []).push(n);
  });
  return BODY_PART_ORDER
    .filter(p=>byPart[p] && byPart[p].length)
    .map(p=>({ group: p, items: byPart[p] }));
}

/* ===== インターバルタイマー ===== */
const timer = { total:0, remaining:0, endsAt:0, running:false, tick:null, wakeLock:null, audio:null };

function parseRestSeconds(rest){
  if(!rest) return null;
  const str = String(rest);
  const m = str.match(/(\d+)/);
  if(!m) return null;
  let n = parseInt(m[1], 10);
  if(/分/.test(str) && n <= 10) n = n * 60;
  return (n > 0 && n <= 600) ? n : null;
}

function fmtTime(sec){
  const s = Math.max(0, Math.ceil(sec));
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}

function ensureAudio(){
  try{
    if(!timer.audio) timer.audio = new (window.AudioContext || window.webkitAudioContext)();
    if(timer.audio.state === 'suspended') timer.audio.resume();
  }catch(e){ /* 音が出せない環境は無音で続行 */ }
}

function beep(){
  try{
    if(!timer.audio) return;
    const ctx = timer.audio;
    [0, 0.28, 0.56].forEach(offset=>{
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime + offset);
      gain.gain.exponentialRampToValueAtTime(0.35, ctx.currentTime + offset + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + offset + 0.20);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(ctx.currentTime + offset);
      osc.stop(ctx.currentTime + offset + 0.22);
    });
  }catch(e){ /* noop */ }
}

async function requestWakeLock(){
  try{
    if('wakeLock' in navigator && !timer.wakeLock){
      timer.wakeLock = await navigator.wakeLock.request('screen');
      timer.wakeLock.addEventListener('release', ()=>{ timer.wakeLock = null; });
    }
  }catch(e){ /* 未対応環境は無視 */ }
}

function releaseWakeLock(){
  try{ if(timer.wakeLock){ timer.wakeLock.release(); timer.wakeLock = null; } }catch(e){}
}

function startTimer(sec){
  if(!sec || sec <= 0) return;
  ensureAudio();
  requestWakeLock();
  timer.total = sec;
  timer.remaining = sec;
  timer.endsAt = Date.now() + sec*1000;
  timer.running = true;
  if(timer.tick) clearInterval(timer.tick);
  timer.tick = setInterval(tickTimer, 200);
  paintTimer();
}

function tickTimer(){
  if(!timer.running) return;
  const prev = timer.remaining;
  timer.remaining = (timer.endsAt - Date.now()) / 1000;
  if(prev > 0 && timer.remaining <= 0){
    timer.remaining = 0;
    timer.running = false;
    clearInterval(timer.tick); timer.tick = null;
    releaseWakeLock();
    beep();
    if(navigator.vibrate) navigator.vibrate([200, 100, 200]);
  }
  paintTimer();
}

function toggleTimer(){
  if(timer.remaining <= 0) return;
  if(timer.running){
    timer.running = false;
    if(timer.tick){ clearInterval(timer.tick); timer.tick = null; }
    releaseWakeLock();
  } else {
    timer.endsAt = Date.now() + timer.remaining*1000;
    timer.running = true;
    requestWakeLock();
    timer.tick = setInterval(tickTimer, 200);
  }
  paintTimer();
}

function addTimer(sec){
  if(timer.total === 0) return;
  timer.total += sec;
  timer.remaining += sec;
  if(timer.running) timer.endsAt += sec*1000;
  else if(timer.remaining > 0){ /* 一時停止のまま延長 */ }
  paintTimer();
}

function stopTimer(){
  timer.running = false; timer.remaining = 0; timer.total = 0;
  if(timer.tick){ clearInterval(timer.tick); timer.tick = null; }
  releaseWakeLock();
  paintTimer();
}

function paintTimer(){
  const bar = document.getElementById('timerBar');
  if(!bar) return;
  if(timer.total === 0){
    bar.style.display = 'none';
    document.body.classList.remove('timer-on');
    return;
  }
  bar.style.display = 'flex';
  document.body.classList.add('timer-on');
  const done = timer.remaining <= 0;
  bar.classList.toggle('done', done);
  document.getElementById('timerTime').textContent = done ? '⏰ 終了' : fmtTime(timer.remaining);
  document.getElementById('timerToggle').textContent = done ? '再開' : (timer.running ? '一時停止' : '再開');
  document.getElementById('timerToggle').style.display = done ? 'none' : '';
  document.getElementById('timerProgress').style.width =
    (done ? 100 : Math.min(100, (1 - timer.remaining/timer.total) * 100)) + '%';
}

function fmtDelta(cur, prev, unit){
  if(prev == null || cur == null) return '';
  const d = +(cur - prev).toFixed(1);

  return `（前回比 ${d > 0 ? '+' : ''}${d}${unit}）`;
}

/* ===== 折れ線グラフ ===== */
function lineChartSVG(data, unit, color){
  // data: [{date, value}] 昇順
  if(data.length === 0) return `<div class="sub">データがありません。</div>`;
  const W = 320, H = 130, L = 38, R = 10, T = 12, B = 22;
  if(data.length === 1){
    return `<div class="chart-single">${data[0].value}${unit}<span>（${escapeHtml(data[0].date)}）記録が2件以上になるとグラフが表示されます</span></div>`;
  }
  const vals = data.map(d=>d.value);
  let min = Math.min(...vals), max = Math.max(...vals);
  if(min === max){ min -= 1; max += 1; }
  const pad = (max - min) * 0.15;
  min -= pad; max += pad;
  const x = i => L + (W - L - R) * (i / (data.length - 1));
  const y = v => T + (H - T - B) * (1 - (v - min) / (max - min));
  const pts = data.map((d,i)=>`${x(i).toFixed(1)},${y(d.value).toFixed(1)}`).join(' ');
  const dots = data.map((d,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(d.value).toFixed(1)}" r="2.6" fill="${color}"/>`).join('');
  const first = data[0], lastD = data[data.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img">
    <line x1="${L}" y1="${y(max-pad).toFixed(1)}" x2="${W-R}" y2="${y(max-pad).toFixed(1)}" class="grid"/>
    <line x1="${L}" y1="${y(min+pad).toFixed(1)}" x2="${W-R}" y2="${y(min+pad).toFixed(1)}" class="grid"/>
    <text x="4" y="${(y(max-pad)+3.5).toFixed(1)}" class="axis">${(+(max-pad).toFixed(1))}</text>
    <text x="4" y="${(y(min+pad)+3.5).toFixed(1)}" class="axis">${(+(min+pad).toFixed(1))}</text>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
    <text x="${L}" y="${H-6}" class="axis">${escapeHtml(first.date.slice(5))}</text>
    <text x="${W-R}" y="${H-6}" class="axis" text-anchor="end">${escapeHtml(lastD.date.slice(5))}</text>
  </svg>`;
}

/* ===== 週次ボリューム / 1RM推移 ===== */
function weekStart(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() - d.getDay()); // 日曜始まり
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function weeklyVolume(weeksBack){
  const sessions = getSessions().filter(s=>s.type!=='cardio' && s.date);
  const thisWeek = weekStart(todayStr());
  const target = new Date(thisWeek + 'T00:00:00');
  target.setDate(target.getDate() - weeksBack*7);
  const wk = target.getFullYear() + '-' + String(target.getMonth()+1).padStart(2,'0') + '-' + String(target.getDate()).padStart(2,'0');
  const byPart = {};
  let sessionCount = 0;
  sessions.forEach(s=>{
    if(weekStart(s.date) !== wk) return;
    sessionCount++;
    (s.exercises||[]).forEach(e=>{
      const work = (e.sets||[]).filter(x=>!x.warmup).length;
      if(!work) return;
      const p = bodyPartOf(e.name);
      byPart[p] = (byPart[p]||0) + work;
    });
  });
  return { week: wk, byPart, sessionCount };
}

function weeklyVolumeText(){
  const cur = weeklyVolume(0), prev = weeklyVolume(1);
  const parts = BODY_PART_ORDER.filter(p=>p!=='その他');
  const fmt = v => parts.map(p=>`${p}${v.byPart[p]||0}`).join(' ');
  if(cur.sessionCount === 0 && prev.sessionCount === 0) return '';
  return `【週あたりの部位別セット数（本番セットのみ）】\n今週(${cur.week}〜) 筋トレ${cur.sessionCount}回: ${fmt(cur)}\n前週 筋トレ${prev.sessionCount}回: ${fmt(prev)}\n筋肥大の目安は週10〜20セット/部位です。直近2週で明らかにセット数が不足している部位があれば、次回メニューでその部位を優先し、評価コメントでも指摘してください。`;
}

function renderWeeklyVolumeCard(){
  const cur = weeklyVolume(0);
  const prev = weeklyVolume(1);
  const parts = BODY_PART_ORDER.filter(p=>p!=='その他');
  const maxVal = Math.max(10, ...parts.map(p=>cur.byPart[p]||0));
  let rows = parts.map(p=>{
    const v = cur.byPart[p] || 0;
    const pv = prev.byPart[p] || 0;
    // 筋肥大の目安は週10〜20セット
    const cls = v === 0 ? '' : (v < 10 ? ' low' : (v <= 20 ? ' good' : ' over'));
    return `<div class="vol-row">
      <span class="vol-part">${p}</span>
      <span class="vol-bar"><span class="vol-fill${cls}" style="width:${Math.min(100, v/maxVal*100)}%"></span></span>
      <span class="vol-num${cls}">${v}<span class="vol-prev">（前週${pv}）</span></span>
    </div>`;
  }).join('');
  return `<div class="card">
    <h2>📊 今週の部位別セット数</h2>
    <div class="sub" style="margin-bottom:10px">${cur.week} の週 / 筋トレ${cur.sessionCount}回。本番セットのみ集計。筋肥大の目安は<b>週10〜20セット</b>です。</div>
    ${rows}
    <div class="vol-legend"><span class="dot vol-dot-low"></span>10未満（不足）　<span class="dot vol-dot-good"></span>10〜20（適正）　<span class="dot vol-dot-over"></span>20超</div>
  </div>`;
}

function exercise1RMSeries(name){
  return getSessions()
    .filter(s=>s.type!=='cardio' && s.date)
    .sort((a,b)=>a.date.localeCompare(b.date))
    .map(s=>{
      const ex = (s.exercises||[]).find(e=>e.name === name);
      if(!ex) return null;
      // Epley式で本番セットの最大推定1RMを算出
      const est = (ex.sets||[]).filter(x=>!x.warmup && x.weight!=null && x.reps!=null)
        .map(x=>x.weight * (1 + x.reps/30));
      if(est.length === 0) return null;
      return { date: s.date, value: +Math.max(...est).toFixed(1) };
    })
    .filter(Boolean);
}

function trackedExerciseNames(){
  const counts = {};
  getSessions().filter(s=>s.type!=='cardio').forEach(s=>{
    (s.exercises||[]).forEach(e=>{
      const hasLoad = (e.sets||[]).some(x=>!x.warmup && x.weight!=null && x.reps!=null);
      if(hasLoad) counts[e.name] = (counts[e.name]||0) + 1;
    });
  });
  return Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
}

function render1RMCard(){
  const names = trackedExerciseNames();

    return `<div class="card"><h2>🏋️ 推定1RMの推移</h2><div class="sub">重量入りの記録がまだありません。</div></div>`;

  </div>`;
}

function buildShareText(s){
  if(!s) return '';
  let out = `🏋️ ${s.date||''} のトレーニング\n`;
  if(s.type==='cardio'){
    out += `\n${s.cardio==='run'?'🏃 ランニング':'🚶 ウォーキング'}${cardioDetailLabel(s)}\n`;
    return out;
  }
  if(s.cardio && s.cardio!=='none'){
    out += `${s.cardio==='run'?'🏃 ランニング':'🚶 ウォーキング'}${cardioDetailLabel(s)}\n`;
  }
  (s.exercises||[]).forEach(ex=>{
    out += `\n■ ${ex.name}\n`;
    let wi = 0;
    (ex.sets||[]).forEach(set=>{
      const label = set.warmup ? 'アップ' : String(++wi);
      out += `  ${label}. ${setWeightLabel(set)}${set.reps!=null?` × ${set.reps}回`:''}\n`;
    });
  });
  if(s.next_menu && s.next_menu.focus){
    out += `\n次回: ${s.next_menu.focus}\n`;
  }
  return out;
}

function drawShareImage(s){
  const SC = 2, W = 640, PAD = 34;
  const rows = [];
  if(s.type==='cardio'){
    rows.push({t:'ex', text: (s.cardio==='run'?'🏃 ランニング':'🚶 ウォーキング') + cardioDetailLabel(s)});
  } else {
    (s.exercises||[]).forEach(ex=>{
      rows.push({t:'ex', text: ex.name});
      let wi = 0;
      (ex.sets||[]).forEach(set=>{
        const label = set.warmup ? 'アップ' : String(++wi);
        rows.push({t:'set', label, text: `${setWeightLabel(set)}${set.reps!=null?` × ${set.reps}回`:''}`});
      });
    });
  }
  const headerH = 108;
  const cardioH = (s.type!=='cardio' && s.cardio && s.cardio!=='none') ? 38 : 0;
  let bodyH = 12;
  rows.forEach(r=>{ bodyH += (r.t==='ex' ? 44 : 32); });
  const nextH = (s.next_menu && s.next_menu.focus) ? 56 : 0;
  const footerH = 52;
  const H = headerH + cardioH + bodyH + nextH + footerH + PAD;

  const c = document.createElement('canvas');
  c.width = W*SC; c.height = H*SC;
  const ctx = c.getContext('2d');
  ctx.scale(SC, SC);
  const FONT = '-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif';

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  const grad = ctx.createLinearGradient(0, 0, W, headerH);
  grad.addColorStop(0, '#f97316');
  grad.addColorStop(1, '#ea580c');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, headerH);
  ctx.fillStyle = '#ffffff';
  ctx.font = `700 30px ${FONT}`;
  ctx.fillText('💪 今日のトレーニング', PAD, 48);
  ctx.font = `400 21px ${FONT}`;
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  ctx.fillText(s.date || '', PAD, 82);

  let y = headerH + 32;
  if(cardioH){
    ctx.fillStyle = '#6b7a89';
    ctx.font = `400 20px ${FONT}`;
    ctx.fillText(`${s.cardio==='run'?'🏃 ランニング':'🚶 ウォーキング'}${cardioDetailLabel(s)}`, PAD, y);
    y += cardioH;
  }
  y += 6;
  rows.forEach(r=>{
    if(r.t==='ex'){
      ctx.fillStyle = '#1a2530';
      ctx.font = `700 24px ${FONT}`;
      ctx.fillText(r.text, PAD, y);
      y += 44;
    } else {
      ctx.fillStyle = r.label==='アップ' ? '#b45309' : '#9aa7b3';
      ctx.font = `700 17px ${FONT}`;
      ctx.fillText(r.label, PAD + 14, y - 4);
      ctx.fillStyle = '#3d4c5a';
      ctx.font = `400 20px ${FONT}`;
      ctx.fillText(r.text, PAD + 80, y - 4);
      y += 32;
    }
  });

  if(nextH){
    y += 6;
    ctx.strokeStyle = '#e3e8ee';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(PAD, y-12); ctx.lineTo(W-PAD, y-12); ctx.stroke();
    ctx.fillStyle = '#f97316';
    ctx.font = `700 20px ${FONT}`;
    ctx.fillText(`次回: ${s.next_menu.focus}`, PAD, y + 20);
    y += nextH;
  }

  ctx.fillStyle = '#b3bdc7';
  ctx.font = `400 16px ${FONT}`;
  ctx.fillText('筋トレAIコーチ', PAD, H - 24);
  return c;
}

async function shareSessionImage(s){
  const canvas = drawShareImage(s);
  const blob = await new Promise(res=>canvas.toBlob(res, 'image/png'));
  const file = new File([blob], `workout-${s.date||'record'}.png`, { type:'image/png' });
  if(navigator.canShare && navigator.canShare({ files:[file] })){
    try{
      await navigator.share({ files:[file] });
      return 'shared';
    }catch(err){
      if(err && err.name === 'AbortError') return 'aborted';
    }
  }
  state.shareImage = canvas.toDataURL('image/png');
  render();
  return 'preview';
}

}

function renderCalendar(sessions){
  if(state.calMonth===null || state.calMonth===undefined){
    const t = new Date();
    state.calMonth = t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0');
  }
  const [yStr, mStr] = state.calMonth.split('-');
  const year = parseInt(yStr,10), month = parseInt(mStr,10);

  // 日付ごとに記録を集約
  const byDate = {};
  sessions.forEach(s=>{
    if(!s.date) return;
    if(!byDate[s.date]) byDate[s.date] = { strength:false, cardio:null, ids:[] };
    if(s.type==='cardio'){
      if(!byDate[s.date].cardio) byDate[s.date].cardio = s.cardio;
    } else {
      byDate[s.date].strength = true;
      if(s.cardio && s.cardio!=='none' && !byDate[s.date].cardio) byDate[s.date].cardio = s.cardio;
    }
    byDate[s.date].ids.push(s.id);
  });

  const first = new Date(year, month-1, 1);
  const daysInMonth = new Date(year, month, 0).getDate();
  const startDow = first.getDay();

  // 当月の集計
  let cntStrength = 0, cntCardio = 0;
  Object.keys(byDate).forEach(d=>{
    if(d.startsWith(state.calMonth)){
      if(byDate[d].strength) cntStrength++;
      if(byDate[d].cardio) cntCardio++;
    }
  });

  let html = `<div class="card">
    <div class="cal-head">
      <button class="cal-nav" id="calPrev">‹</button>
      <div class="cal-title">${year}年${month}月</div>
      <button class="cal-nav" id="calNext">›</button>
    </div>
    <div class="cal-grid">`;
  ['日','月','火','水','木','金','土'].forEach((d,i)=>{
    html += `<div class="cal-dow${i===0?' sun':(i===6?' sat':'')}">${d}</div>`;
  });
  for(let i=0;i<startDow;i++){ html += `<div class="cal-cell empty"></div>`; }
  const today = todayStr();
  for(let day=1; day<=daysInMonth; day++){
    const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const rec = byDate[dateStr];
    const isToday = dateStr===today;
    let marks = '';
    if(rec){
      if(rec.strength) marks += `<span class="dot dot-strength"></span>`;
      if(rec.cardio) marks += `<span class="dot ${rec.cardio==='run'?'dot-run':'dot-walk'}"></span>`;
    }
    html += `<div class="cal-cell${rec?' has-rec':''}${isToday?' today':''}"${rec?` data-date="${dateStr}"`:''}>
      <div class="cal-day">${day}</div>
      <div class="cal-marks">${marks}</div>
    </div>`;
  }
  html += `</div>
    <div class="cal-legend">
      <span><span class="dot dot-strength"></span>筋トレ ${cntStrength}日</span>
      <span><span class="dot dot-run"></span>ランニング</span>
      <span><span class="dot dot-walk"></span>ウォーキング</span>
      <span class="cal-legend-total">有酸素 ${cntCardio}日</span>
    </div>
  </div>`;
  return html;
}

/* ===== バックアップ / 復元 ===== */
function buildBackupJson(){
  const payload = { app:'workout-ai-coach', version:1, exportedAt:new Date().toISOString(), data:{} };
  BACKUP_KEYS.forEach(k=>{
    const v = localStorage.getItem(k);
    if(v != null) payload.data[k] = v;
  });
  return JSON.stringify(payload, null, 2);
}

function markBackedUp(){ localStorage.setItem(LS_KEY_LAST_BACKUP, todayStr()); }

function daysSinceBackup(){
  const last = localStorage.getItem(LS_KEY_LAST_BACKUP);
  if(!last) return null;
  const diff = (new Date(todayStr()) - new Date(last)) / 86400000;
  return isNaN(diff) ? null : Math.round(diff);
}

async function exportBackup(){
  const json = buildBackupJson();
  const name = `workout-backup-${todayStr()}.json`;
  const file = new File([json], name, { type:'application/json' });
  if(navigator.canShare && navigator.canShare({ files:[file] })){
    try{
      await navigator.share({ files:[file] });
      markBackedUp();
      return '共有シートから保存先を選んでください';
    }catch(err){
      if(err && err.name === 'AbortError') return null;
    }
  }
  const url = URL.createObjectURL(new Blob([json], { type:'application/json' }));
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
  markBackedUp();
  return 'ファイルを書き出しました';
}

function parseBackup(text){
  const parsed = JSON.parse(text);
  if(!parsed || parsed.app !== 'workout-ai-coach' || !parsed.data){
    throw new Error('このアプリのバックアップではありません');
  }
  return parsed;
}

function restoreBackup(text, mode){
  const parsed = parseBackup(text);
  const d = parsed.data;
  if(mode === 'replace'){
    BACKUP_KEYS.forEach(k=>{
      if(d[k] != null) localStorage.setItem(k, d[k]);
      else localStorage.removeItem(k);
    });
    return '置き換えました';
  }
  // マージ: 記録はid重複を除いて追加、設定は未設定の項目のみ取り込む
  let added = 0;
  if(d[LS_KEY_SESSIONS]){
    const incoming = JSON.parse(d[LS_KEY_SESSIONS]);
    const current = getSessions();
    const ids = new Set(current.map(s=>s.id));
    incoming.forEach(s=>{ if(!ids.has(s.id)){ current.push(s); ids.add(s.id); added++; } });
    current.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    saveSessions(current);
  }
  if(d[LS_KEY_BODY]){
    const incoming = JSON.parse(d[LS_KEY_BODY]);
    const current = getBodyLogs();
    const keys = new Set(current.map(b=>b.date));
    incoming.forEach(b=>{ if(!keys.has(b.date)){ current.push(b); keys.add(b.date); } });
    current.sort((a,b)=>a.date.localeCompare(b.date));
    saveBodyLogs(current);
  }
  if(d[LS_KEY_CUSTOM_EX]){
    const incoming = JSON.parse(d[LS_KEY_CUSTOM_EX]);
    const merged = Array.from(new Set(getCustomExercises().concat(incoming)));
    saveCustomExercises(merged);
  }
  [LS_KEY_CONDITION, LS_KEY_GYM_EQUIP_1, LS_KEY_GYM_EQUIP_2].forEach(k=>{
    if(d[k] != null && localStorage.getItem(k) == null) localStorage.setItem(k, d[k]);
  });
  return `${added}件の記録を追加しました`;
}

function renderCustomExCard(){

      state.error = null;
      render();
    }catch(err){
      state.error = '保存に失敗しました: ' + err.message;
      render();
    }
  };

  const btnDeleteSession = document.getElementById('btnDeleteSession');
  if(btnDeleteSession) btnDeleteSession.onclick = ()=>{
    if(!confirm('この記録を削除しますか？')) return;
    const sessions = getSessions().filter(s=>s.id!==state.viewingSession.id);
    saveSessions(sessions);
    state.viewingSession = null;
    render();
  };
}

async function copyToClipboard(text){
  if(navigator.clipboard && window.isSecureContext){
    try{ await navigator.clipboard.writeText(text); return; }catch(e){ /* fall through */ }
  }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
}

function parseClaudeJson(text){
  let t = text.trim();
  t = t.replace(/^```json\s*/i, '').replace(/^```\s*/, '').replace(/```\s*$/, '');
  return JSON.parse(t);
}

function buildPrompt(gymId, cardio, workoutText, pain){
  const sessions = getSessions().slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).slice(-5);
  let historyText = 'なし（初回の記録です）';
  if(sessions.length>0){
    historyText = sessions.map(s=>{
      if(s.type==='cardio'){
        return `${s.date}: 有酸素のみ ${CARDIO_LABELS[s.cardio]||s.cardio}${cardioDetailLabel(s)}、筋トレなし`;
      }
      const detail = (s.exercises||[]).map(e=>{
        // 本番セットの「重量×回数」を並べる（アップは漸進性の判断に不要なので除く）
        const work = (e.sets||[]).filter(x=>!x.warmup)
          .map(x=>`${x.weight==null?'自重':x.weight+'kg'}×${x.reps==null?'?':x.reps}`)
          .join(', ');
        return `${e.name} ${work}${e.maxRM?`（推定1RM ${e.maxRM}kg）`:''}`;
      }).join(' / ');
      const cat = s.next_menu && s.next_menu.category ? s.next_menu.category : '不明';
      const cardioLabel = CARDIO_LABELS[s.cardio] || '記録なし';
      return `${s.date} [${cat}] 有酸素=${cardioLabel}${cardioDetailLabel(s)}\n    ${detail}\n    評価メモ: ${(s.evaluation||'').slice(0,100)}`;
    }).join('\n');
  }
  const gymName = GYM_NAMES[gymId];
  const gymEquip = getGymEquip(gymId);
  const cardioLabel = CARDIO_LABELS[cardio] || 'なし';
  const painLabel = (pain != null) ? String(pain) : '未記録';
  const cardioAmountLabel = cardioDetailLabel({ cardioMin: numOrNull(state.cardioMin), cardioKm: numOrNull(state.cardioKm) });
  const intro = workoutText
    ? `あなたは経験豊富なパーソナルトレーナーです。以下の「今日のトレーニング内容」をもとに、評価と次回のトレーニングメニューを提案してください。

【今日のトレーニング内容】（${todayStr()}）
${workoutText}`
    : `あなたは経験豊富なパーソナルトレーナーです。添付した「筋トレMEMO」のサマリー画面の写真から、その日のトレーニング内容を正確に読み取り、評価と次回のトレーニングメニューを提案してください。`;
  return `${intro}

【ユーザー情報】
${getCondition()}
腹筋(アブドミナル、ロータリートルソー等)は自宅で別途鍛えているため、ジムでの提案は控えめにしてください（must_exercisesには含めず、optional_exercisesに含める場合も1種目までにする）。
${bodyTrendText()}
${weeklyVolumeText()}

【3分割ローテーション】
次回メニューのfocus/categoryは、必ず以下の3カテゴリのいずれか1つにしてください。
- "Push": 胸・三頭筋・三角筋前部
- "Pull": 背中(広背筋・僧帽筋)・二頭筋・三角筋後部
- "Legs+": 三角筋中部・脚・その他
直近のセッション履歴にある「前回提案カテゴリ」を参照し、同じカテゴリが連続しないよう、バランスよくローテーションしてください。

【直近のセッション履歴（各種目は本番セットの「重量×回数」を時系列で記載）】
${historyText}
今日のトレーニング内容にRPE（主観的追い込み度。10=限界であと0回、8=あと2回できた、7=あと3回）が記載されている種目は、それを最優先の判断材料にしてください。RPE 6〜7なら重量を上げ、8〜9なら現状維持、9.5〜10なら据え置きか回数調整、という方針で次回の重量を決めてください。
上記の過去の重量・回数を必ず参照し、次回メニューのtargetには「前回○kgだったので今回は△kg」と具体的な重量を提示してください。同じ種目を過去にやっている場合は、その実績から漸進的に負荷を上げる（伸びていなければ据え置き・回数で調整する）判断をしてください。評価コメントでも、前回の同一種目と比較した増減に言及してください。

【今日の左ハムの痛み】${painLabel}（0=なし〜10=最大）${painTrendText()}
痛みが1以上の日は脚種目を提案せず、3以上なら評価コメントで運動強度を落とすよう明確に助言してください。0が続いている場合のみ、脚種目を段階的に再開する提案をしてください。

【今日の有酸素運動】${cardioLabel}${cardioAmountLabel}
ランニングをした日は脚トレを行わない方針です。今日ランニングをしている場合、今回のトレーニング内容に脚種目が含まれていれば評価コメントで軽く触れてください。また、次回メニューのカテゴリが"Legs+"になる場合は、notesに必ず「ランニングをする予定の日は脚トレを避けてください」という趣旨の注意を含めてください。

【次回トレーニングを行うジム】${gymName}
【このジムの設備】
${gymEquip}
次回メニューの種目は、必ず上記の設備のみで実施できるものにしてください。設備にない種目は提案しないでください。

【出力ルール】
以下のJSON形式のみを出力してください。説明文やMarkdownのコードフェンス(\`\`\`)は一切付けないでください。
{
  "date": "${workoutText ? todayStr() : '画像内の日付(YYYY-MM-DD)。読み取れない場合は今日の日付'}",
  "exercises": [
    {"name": "種目名", "sets": [{"weight": 数値kg(自重の場合はnull), "reps": 数値, "warmup": ウォームアップセットならtrue、通常セットはfalse}], "maxRM": その種目の最大推定1RM(数値、なければnull)}
  ],
  "evaluation": "このセッションの評価。前回までの履歴と比較した進捗、頑張った点、フォームや強度に関する注意点などを2〜4文で。日本語。",
  "next_menu": {
    "gym": "${gymName}",
    "category": "Push または Pull または Legs+ のいずれか",
    "focus": "次回トレーニングの部位・テーマ（例: 背中・二頭筋中心）",
    "must_exercises": [
      {"name": "種目名（必ず上記設備リストにあるもののみ）", "target": "目安（例: 3-4セット×10-15回、22kg前後から開始）", "rest": "セット間のレスト時間（例: 60秒）", "warmup": {"weight": ウォームアップ推奨重量(数値kg)、不要な種目はnull, "reps": 推奨回数(数値)、不要ならnull}}
    ],
    "optional_exercises": [
      {"name": "種目名（必ず上記設備リストにあるもののみ）", "target": "目安", "rest": "レスト時間", "warmup": {"weight": 数値またはnull, "reps": 数値またはnull}}
    ],
    "notes": "怪我への配慮、漸進性、フォームなどに関する補足を1〜2文で。"
  }
}
must_exercisesは「絶対にやるべき種目」を必ず4種目、optional_exercisesは「時間があればやる種目」を必ず4種目、合計8種目ちょうどにしてください。それ以上の種目数は提案しないでください。全種目に必ずrest（レスト時間）を明記してください。

【ウォームアップについて】
高重量を扱う種目や、いきなり本番重量に入ると怪我のリスクがある種目（コンパウンド種目・胸/背中/脚の主要種目など）には、warmupにアップセットの推奨重量と回数を入れてください（本番重量の40〜60%程度 × 10〜15回が目安）。軽量の単関節種目やマシンの補助種目などアップが不要な種目は、warmupのweight・repsをnullにしてください。

【評価について】
今日のトレーニングはセットごとに重量・回数が記録されています。セット間の重量の落ち方（後半で重量や回数が落ちているか）にも触れ、次回の重量設定の参考になるコメントをしてください。`;
}

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function shiftMonth(ym, delta){
  const [y, m] = ym.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
